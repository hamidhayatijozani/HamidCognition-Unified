services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-action_gate}
      POSTGRES_USER: ${POSTGRES_USER:-action_gate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    environment:
      ACTION_GATE_URL: http://action-gate:8000
      ACTION_GATE_API_TOKEN: $ACTION_GATE_API_TOKEN
      ACTION_GATE_APPROVAL_SECRET: ${ACTION_GATE_APPROVAL_SECRET:?set ACTION_GATE_APPROVAL_SECRET}
      ENFORCEMENT_URL: http://enforcement:8080
      PORT: "8081"
    networks:
      - edge
      - backend
    expose:
      - "8081"
    depends_on:
      action-gate:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/').read()"]
      interval: 10s
      timeout: 3s
      retries: 12

  action-gate:
    build:
      context: ..
      dockerfile: action_gate/Dockerfile
    environment:
      ACTION_GATE_ENV: production
      ACTION_GATE_API_TOKEN: ${ACTION_GATE_API_TOKEN:?set ACTION_GATE_API_TOKEN}
      ACTION_GATE_SIGNING_SECRET: ${ACTION_GATE_SIGNING_SECRET:?set ACTION_GATE_SIGNING_SECRET}
      ACTION_GATE_KEY_ID: ${ACTION_GATE_KEY_ID:-hhj-csg-poc-1}
      ACTION_GATE_SIGNING_KEYS: ${ACTION_GATE_SIGNING_KEYS:-}
      ACTION_GATE_DATABASE_URL: postgresql://${POSTGRES_USER:-action_gate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-action_gate}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-action_gate}
      POSTGRES_DB: ${POSTGRES_DB:-action_gate}
      ACTION_GATE_RATE_LIMIT_PER_MINUTE: ${ACTION_GATE_RATE_LIMIT_PER_MINUTE:-120}
      ACTION_GATE_DECISION_TTL_SECONDS: ${ACTION_GATE_DECISION_TTL_SECONDS:-300}
      ACTION_GATE_APPROVAL_TTL_SECONDS: ${ACTION_GATE_APPROVAL_TTL_SECONDS:-300}
      ACTION_GATE_POLICY_JSON: ${ACTION_GATE_POLICY_JSON:-}
      ACTION_GATE_AUTHORITY_SECRET: ${ACTION_GATE_AUTHORITY_SECRET:?set ACTION_GATE_AUTHORITY_SECRET}
      ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
    networks:
      - backend
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  tool:
    build:
      context: .
      dockerfile: Dockerfile.tool
    environment:
      ACTION_GATE_SIGNING_SECRET: ${ACTION_GATE_SIGNING_SECRET:?set ACTION_GATE_SIGNING_SECRET}
      ACTION_GATE_AUTHORITY_SECRET: ${ACTION_GATE_AUTHORITY_SECRET:?set ACTION_GATE_AUTHORITY_SECRET}
      TOOL_NONCE_DB: /data/tool_authority.db
    volumes:
      - tool_data:/data
    networks:
      - backend
    expose:
      - "9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',9000),2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  enforcement:
    build:
      context: .
      dockerfile: Dockerfile.enforcement
    environment:
      GATE_URL: http://action-gate:8000
      TOOL_URL: http://tool:9000
      ACTION_GATE_API_TOKEN: ${ACTION_GATE_API_TOKEN:?set ACTION_GATE_API_TOKEN}
      ACTION_GATE_AUTHORITY_SECRET: ${ACTION_GATE_AUTHORITY_SECRET:?set ACTION_GATE_AUTHORITY_SECRET}
      MODE: http
      PORT: "8080"
    networks:
      - edge
      - backend
    expose:
      - "8080"
    depends_on:
      action-gate:
        condition: service_healthy
      tool:
        condition: service_healthy
    restart: unless-stopped

  chatgpt-mcp:
    build:
      context: ..
      dockerfile: action_gate/Dockerfile.mcp
    environment:
      ACTION_GATE_URL: http://action-gate:8000
      PROTECTED_TOOL_URL: http://tool:9000
      ACTION_GATE_API_TOKEN: ${ACTION_GATE_API_TOKEN:?set ACTION_GATE_API_TOKEN}
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-chatgpt-demo}
      DEMO_ACTOR_ID: ${DEMO_ACTOR_ID:-chatgpt-user}
      DEMO_AGENT_ID: ${DEMO_AGENT_ID:-chatgpt-demo-agent}
      DEMO_SESSION_ID: ${DEMO_SESSION_ID:-chatgpt-demo-session}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?set MCP_BEARER_TOKEN}
      MCP_ISSUER_URL: ${MCP_ISSUER_URL:-https://auth.example.com}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-https://localhost/mcp}
      MCP_REQUIRED_SCOPE: ${MCP_REQUIRED_SCOPE:-mcp:execute}
      MCP_CLIENT_ID: ${MCP_CLIENT_ID:-chatgpt-demo-client}
      MCP_TOKEN_TTL_SECONDS: ${MCP_TOKEN_TTL_SECONDS:-3600}
    networks:
      - edge
      - backend
    expose:
      - "8787"
    depends_on:
      action-gate:
        condition: service_healthy
      tool:
        condition: service_healthy
    restart: unless-stopped

  edge:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      enforcement:
        condition: service_started
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  tool_data:
