name: ClaimLab Research Tests

on:
  push:
    paths:
      - "research/claimlab/**"
      - "tests/test_claimlab.py"
      - ".github/workflows/claimlab.yml"
  pull_request:
    paths:
      - "research/claimlab/**"
      - "tests/test_claimlab.py"
      - ".github/workflows/claimlab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claimlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest fastapi httpx uvicorn pydantic
      - name: Run ClaimLab tests
        run: python -m pytest -q tests/test_claimlab.py
      - name: Compile ClaimLab
        run: python -m compileall -q research/claimlab
