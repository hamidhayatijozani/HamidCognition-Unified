name: ClaimLab Reality Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/claimlab/**"
      - "tests/test_claimlab.py"
      - ".github/workflows/claimlab.yml"
  pull_request:
    paths:
      - "research/claimlab/**"
      - "tests/test_claimlab.py"
      - ".github/workflows/claimlab.yml"

permissions:
  contents: read

jobs:
  claimlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run ClaimLab structured evidence tests
        run: pytest -q tests/test_claimlab.py
