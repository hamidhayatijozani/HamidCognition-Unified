name: Master Evidence Gate

on:
  push:
    branches: [ main, 'integration/**', 'research/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  validation:
    name: 19-step operational validation
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: evidence
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/evidence
      PG_CONTAINER: evidence-postgres
    steps:
      - name: "01 Checkout exact revision"
        uses: actions/checkout@v4
      - name: "02 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "03 Install test dependencies"
        run: |
          python -m pip install --upgrade pip
          if [ -f action_gate/requirements.txt ]; then python -m pip install -r action_gate/requirements.txt; fi
          python -m pip install "pytest>=8,<9" "psycopg[binary]>=3.2,<4"
      - name: "04 Initialize evidence ledger"
        run: |
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/commit.txt"
          date -u +%FT%TZ > "$EVIDENCE_DIR/start_utc.txt"
          printf 'event=%s\nref=%s\nsha=%s\nworkflow=%s\nrun_id=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" \
            > "$EVIDENCE_DIR/github-run-context.txt"
      - name: "05 Default project unit suite"
        if: always()
        run: |
          set -o pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/action_gate:$GITHUB_WORKSPACE:$PYTHONPATH"
          python -m pytest -q action_gate 2>&1 | tee "$EVIDENCE_DIR/default-tests.log"
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/default-tests.rc"
          exit 0
      - name: "06 STI unit tests"
        if: always()
        run: |
          set -o pipefail
          python -m pytest -q action_gate/tests/test_sti_001.py 2>&1 | tee "$EVIDENCE_DIR/sti-tests.log"
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/sti-tests.rc"
          exit 0
      - name: "07 STI synthetic benchmark"
        if: always()
        run: |
          set -o pipefail
          python RESEARCH/experiments/sti_001.py --output "$EVIDENCE_DIR/sti-benchmark.json" 2>&1 | tee "$EVIDENCE_DIR/sti-benchmark.log"
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/sti-benchmark.rc"
          exit 0
      - name: "08 200-event Replay"
        if: always()
        run: |
          set -o pipefail
          python RESEARCH/experiments/replay_200.py 2>&1 | tee "$EVIDENCE_DIR/replay-200.log"
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/replay-200.rc"
          exit 0
      - name: "09 Replay integrity verification"
        if: always()
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$EVIDENCE_DIR/replay-integrity.log"
          import json,sys
          d=json.load(open("evidence/replay_200.json"))
          ok=d["events"]==200 and d["source_digest"]==d["replay_digest"] and d["passed"]
          print(json.dumps({"events":d["events"],"digest_match":d["source_digest"]==d["replay_digest"],"passed":ok},indent=2))
          sys.exit(0 if ok else 1)
          PY
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/replay-integrity.rc"
          exit 0
      - name: "10 Start PostgreSQL persistence container"
        if: always()
        run: |
          set -o pipefail
          docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$PG_CONTAINER" -p 54329:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=evidence             --health-cmd='pg_isready -U postgres -d evidence' --health-interval=2s --health-timeout=3s --health-retries=20             postgres:16-alpine | tee "$EVIDENCE_DIR/postgres-container-id.txt"
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/postgres-start.rc"
          exit 0
      - name: "11 PostgreSQL healthcheck"
        if: always()
        run: |
          set +e
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$PG_CONTAINER" 2>/dev/null || true)
            echo "$status"
            if [ "$status" = healthy ]; then echo 0 > "$EVIDENCE_DIR/postgres-health.rc"; exit 0; fi
            sleep 2
          done
          echo 1 > "$EVIDENCE_DIR/postgres-health.rc"
          exit 0
      - name: "12 PostgreSQL seed and baseline"
        if: always()
        run: |
          set -o pipefail
          python RESEARCH/experiments/postgres_persistence.py 2>&1 | tee "$EVIDENCE_DIR/postgres-seed.log"
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/postgres-seed.rc"
          exit 0
      - name: "13 Real PostgreSQL container restart"
        if: always()
        run: |
          set -o pipefail
          docker restart "$PG_CONTAINER" 2>&1 | tee "$EVIDENCE_DIR/postgres-restart.log"
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/postgres-restart.rc"
          exit 0
      - name: "14 PostgreSQL persistence after restart"
        if: always()
        run: |
          set -o pipefail
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$PG_CONTAINER" 2>/dev/null || true)
            [ "$status" = healthy ] && break
            sleep 2
          done
          python RESEARCH/experiments/postgres_verify.py 2>&1 | tee "$EVIDENCE_DIR/postgres-verify.log"
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/postgres-verify.rc"
          exit 0
      - name: "15 Latency benchmark"
        if: always()
        run: |
          set -o pipefail
          python RESEARCH/experiments/latency_check.py 2>&1 | tee "$EVIDENCE_DIR/latency.log"
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/latency.rc"
          exit 0
      - name: "16 Latency threshold gate"
        if: always()
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$EVIDENCE_DIR/latency-gate.log"
          import json,sys
          d=json.load(open("evidence/latency.json"))
          print(json.dumps(d,indent=2))
          sys.exit(0 if d["passed"] else 1)
          PY
          rc=$?
          echo "$rc" > "$EVIDENCE_DIR/latency-gate.rc"
          exit 0
      - name: "17 Build evidence manifest"
        if: always()
        run: |
          git rev-parse HEAD > "$EVIDENCE_DIR/verified_commit.txt"
          python - <<'PY'
          import hashlib,json,os
          root="evidence"
          rows=[]
          for name in sorted(os.listdir(root)):
              p=os.path.join(root,name)
              if os.path.isfile(p):
                  rows.append({"path":p,"sha256":hashlib.sha256(open(p,"rb").read()).hexdigest(),"bytes":os.path.getsize(p)})
          json.dump({"workflow":"Master Evidence Gate","artifact":"validation-evidence-pack","files":rows},open(root+"/manifest.json","w"),indent=2)
          PY
          (cd evidence && zip -q -r validation-evidence-pack.zip . -x validation-evidence-pack.zip)
      - name: "18 Upload validation-evidence-pack"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-pack
          path: evidence/
          if-no-files-found: error
          retention-days: 30
      - name: "19 Final 100-percent gate"
        if: always()
        run: |
          set -e
          failures=0
          for f in default-tests sti-tests sti-benchmark replay-200 replay-integrity postgres-start postgres-health postgres-seed postgres-restart postgres-verify latency latency-gate; do
            if [ -f "evidence/$f.rc" ]; then
              rc=$(cat "evidence/$f.rc")
              echo "$f: rc=$rc"
              [ "$rc" = "0" ] || failures=$((failures+1))
            else
              echo "$f: MISSING"
              failures=$((failures+1))
            fi
          done
          test "$failures" -eq 0
          test -f evidence/manifest.json


      - name: "20 Create official v2.0.0 release"
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.0.0 already exists; nothing to create."
            exit 0
          fi
          CURRENT_ZIP_HASH="$(sha256sum "$EVIDENCE_DIR/validation-evidence-pack.zip" | awk '{print $1}')"
          cat > /tmp/release-notes.md <<EOF
          Certified Governance Release for HamidCognition v2.0.0.

          Validation:
          - Current workflow run: #$GITHUB_RUN_ID
          - Current validated commit: $GITHUB_SHA
          - Evidence ZIP SHA-256 (current run): $CURRENT_ZIP_HASH
          - Prior evidence Run ID: #36036827697
          - Prior evidence ZIP SHA-256: b817b3e56e40e97029a596d36b1cd0907a6095cbc5b4cbdb251a557878f700ef

          The validation gate covers the 19 operational steps:
          01 checkout exact revision
          02 Python 3.11 setup
          03 dependency installation
          04 evidence ledger initialization
          05 default project unit suite
          06 STI unit tests
          07 STI synthetic benchmark
          08 200-event replay
          09 replay integrity verification
          10 PostgreSQL persistence container start
          11 PostgreSQL healthcheck
          12 PostgreSQL seed and baseline
          13 PostgreSQL restart
          14 PostgreSQL persistence after restart
          15 latency benchmark
          16 latency threshold gate
          17 evidence manifest build
          18 validation evidence artifact upload
          19 final 100-percent gate
          EOF
          gh release create v2.0.0             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "HamidCognition v2.0.0 - Certified Governance Release"             --notes-file /tmp/release-notes.md
