name: Security History Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: reachable Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan reachable Git objects
        shell: python
        run: |
          import re
          import subprocess
          import sys
          import threading

          MAX_BLOB_BYTES = 20 * 1024 * 1024
          patterns = [
              re.compile(rb"gh[pousr]_[A-Za-z0-9_]{20,}"),
              re.compile(rb"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(rb"AKIA[0-9A-Z]{16}"),
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"),
              re.compile(rb"AIza[0-9A-Za-z_-]{30,}"),
              re.compile(rb"sk_live_[0-9A-Za-z]{16,}"),
              re.compile(rb"xox[baprs]-[0-9A-Za-z-]{20,}"),
          ]

          objects = subprocess.check_output(
              ["git", "rev-list", "--objects", "--all"],
              text=True,
              stderr=subprocess.DEVNULL,
          ).splitlines()

          all_ids = []
          seen = set()
          for row in objects:
              oid = row.split(maxsplit=1)[0] if row else ""
              if oid and oid not in seen:
                  seen.add(oid)
                  all_ids.append(oid)

          check = subprocess.run(
              ["git", "cat-file", "--batch-check"],
              input=("".join(oid + "\n" for oid in all_ids)).encode(),
              stdout=subprocess.PIPE,
              check=True,
          )

          blob_ids = []
          for line in check.stdout.splitlines():
              parts = line.split()
              if len(parts) == 3 and parts[1] == b"blob" and int(parts[2]) <= MAX_BLOB_BYTES:
                  blob_ids.append(parts[0].decode())

          proc = subprocess.Popen(
              ["git", "cat-file", "--batch"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
          )

          def feed():
              try:
                  proc.stdin.write(("".join(oid + "\n" for oid in blob_ids)).encode())
              finally:
                  proc.stdin.close()

          writer = threading.Thread(target=feed, daemon=True)
          writer.start()

          findings = []
          for _ in blob_ids:
              header = proc.stdout.readline()
              if not header:
                  break
              parts = header.split()
              if len(parts) < 3 or parts[1] != b"blob":
                  continue
              size = int(parts[2])
              data = proc.stdout.read(size)
              proc.stdout.read(1)
              for pattern in patterns:
                  if pattern.search(data):
                      findings.append(parts[0].decode())
                      break

          writer.join()
          rc = proc.wait()
          if rc != 0:
              print(f"git cat-file exited with status {rc}.")
              sys.exit(rc)

          print(f"Scanned {len(blob_ids)} reachable blobs (<= {MAX_BLOB_BYTES} bytes).")
          print(f"Skipped {len(all_ids) - len(blob_ids)} oversized/non-blob objects.")
          if findings:
              print(f"Potential high-confidence secret material found in {len(findings)} blob(s).")
              print("No secret contents are printed. Rotate affected credentials and remove them from reachable history before release.")
              sys.exit(1)
          print("No high-confidence secret signatures detected in reachable history.")
