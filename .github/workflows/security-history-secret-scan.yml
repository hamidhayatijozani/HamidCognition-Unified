name: Security History Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: reachable Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan reachable Git objects
        shell: python
        run: |
          import re
          import subprocess
          import sys

          patterns = [
              re.compile(rb"gh[pousr]_[A-Za-z0-9_]{20,}"),
              re.compile(rb"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(rb"AKIA[0-9A-Z]{16}"),
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"),
              re.compile(rb"AIza[0-9A-Za-z_-]{30,}"),
              re.compile(rb"sk_live_[0-9A-Za-z]{16,}"),
              re.compile(rb"xox[baprs]-[0-9A-Za-z-]{20,}"),
          ]

          objects = subprocess.check_output(
              ["git", "rev-list", "--objects", "--all"],
              text=True,
              stderr=subprocess.DEVNULL,
          ).splitlines()

          blob_ids = []
          seen = set()
          for row in objects:
              parts = row.split(maxsplit=1)
              if not parts:
                  continue
              oid = parts[0]
              if oid in seen:
                  continue
              seen.add(oid)
              blob_ids.append(oid)

          proc = subprocess.Popen(
              ["git", "cat-file", "--batch"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
          )

          findings = []
          for oid in blob_ids:
              proc.stdin.write((oid + "\n").encode())
          proc.stdin.close()

          for oid in blob_ids:
              header = proc.stdout.readline()
              if not header:
                  break
              h = header.split()
              if len(h) < 3 or h[1] != b"blob":
                  continue
              size = int(h[2])
              data = proc.stdout.read(size)
              proc.stdout.read(1)
              if size > 20 * 1024 * 1024:
                  continue
              for pattern in patterns:
                  if pattern.search(data):
                      findings.append(oid)
                      break

          proc.wait()

          print(f"Scanned {len(blob_ids)} reachable Git objects.")
          if findings:
              print(f"Potential high-confidence secret material found in {len(findings)} blob(s).")
              print("No secret contents are printed. Rotate affected credentials and remove them from reachable history before release.")
              sys.exit(1)
          print("No high-confidence secret signatures detected in reachable history.")
