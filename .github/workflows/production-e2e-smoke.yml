name: Action Gate Production E2E Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start production stack
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          ACTION_GATE_APPROVAL_SECRET: ci-only-approval-secret-not-for-production
          MCP_BEARER_TOKEN: ci-mcp-bearer-token
          DOMAIN: localhost
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          ACTION_GATE_API_TOKEN=ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET=ci-signing-secret
          ACTION_GATE_ENFORCEMENT_SECRET=ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET=ci-authority-secret
          ACTION_GATE_APPROVAL_SECRET=ci-only-approval-secret-not-for-production
          MCP_BEARER_TOKEN=ci-mcp-bearer-token
          DOMAIN=localhost
          EOF
          docker compose --env-file .env.ci -f docker-compose.production.yml up -d --build
      - name: Initialize production State Oracle
        working-directory: action_gate
        env:
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
        run: |
          set -euo pipefail
          docker compose --env-file .env.ci exec -T action-gate python - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          payload = {"world_version": "ci-production-e2e-world-v1", "snapshot": {"source": "production-e2e-smoke", "status": "ready"}}
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          signature = hmac.new(os.environ["ACTION_GATE_STATE_ORACLE_SECRET"].encode(), canonical, hashlib.sha256).hexdigest()
          body = json.dumps({**payload, "oracle_signature": signature}).encode()
          req = urllib.request.Request("http://127.0.0.1:8000/v1/state/commit", data=body, headers={"Authorization": "Bearer " + os.environ["ACTION_GATE_API_TOKEN"], "Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=10) as response:
              assert response.status == 200
              print(response.read().decode())
          PY
      - name: Run production E2E smoke
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          ACTION_GATE_APPROVAL_SECRET: ci-only-approval-secret-not-for-production
          MCP_BEARER_TOKEN: ci-mcp-bearer-token
          DOMAIN: localhost
        run: docker compose --env-file .env.ci -f docker-compose.production.yml exec -T action-gate python production_e2e_smoke.py
      - name: Dump container logs on failure
        if: failure()
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          ACTION_GATE_APPROVAL_SECRET: ci-only-approval-secret-not-for-production
          MCP_BEARER_TOKEN: ci-mcp-bearer-token
          DOMAIN: localhost
        run: |
          docker compose --env-file .env.ci -f docker-compose.production.yml ps -a > logs.txt 2>&1 || true
          docker compose --env-file .env.ci -f docker-compose.production.yml logs --tail=1000 >> logs.txt 2>&1 || true
          for id in $(docker compose --env-file .env.ci -f docker-compose.production.yml ps -aq); do
            echo "===== docker inspect $id =====" >> logs.txt
            docker inspect "$id" >> logs.txt 2>&1 || true
            echo "===== docker logs $id =====" >> logs.txt
            docker logs "$id" >> logs.txt 2>&1 || true
          done
        continue-on-error: true
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: action_gate/logs.txt
        continue-on-error: true
      - name: Stop production stack
        if: always()
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          ACTION_GATE_APPROVAL_SECRET: ci-only-approval-secret-not-for-production
          MCP_BEARER_TOKEN: ci-mcp-bearer-token
          DOMAIN: localhost
        run: docker compose --env-file .env.ci -f docker-compose.production.yml down -v
