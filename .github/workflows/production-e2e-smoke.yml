name: Action Gate Production E2E Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start production stack
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_APPROVAL_SECRET: ci-only-approval-secret-not-for-production
          DOMAIN: localhost
        run: docker compose -f docker-compose.production.yml up -d --build
      - name: Run production E2E smoke
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_APPROVAL_SECRET: ci-only-approval-secret-not-for-production
          DOMAIN: localhost
        run: docker compose -f docker-compose.production.yml exec -T action-gate python production_e2e_smoke.py
      - name: Dump container logs on failure
        if: failure()
        working-directory: action_gate
        run: |
          docker compose -f docker-compose.production.yml ps -a > logs.txt 2>&1 || true
          docker compose -f docker-compose.production.yml logs --tail=1000 >> logs.txt 2>&1 || true
          for id in $(docker compose -f docker-compose.production.yml ps -aq); do
            echo "===== docker inspect $id =====" >> logs.txt
            docker inspect "$id" >> logs.txt 2>&1 || true
            echo "===== docker logs $id =====" >> logs.txt
            docker logs "$id" >> logs.txt 2>&1 || true
          done
        continue-on-error: true
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: action_gate/logs.txt
        continue-on-error: true
      - name: Stop production stack
        if: always()
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_APPROVAL_SECRET: ci-only-approval-secret-not-for-production
          DOMAIN: localhost
        run: docker compose -f docker-compose.production.yml down -v
