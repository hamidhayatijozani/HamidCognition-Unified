name: Canonical gates-local proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates-local:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      ACTION_GATE_ENV: development
      ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
      ACTION_GATE_SIGNING_SECRET: ci-signing-secret
      MCP_BEARER_TOKEN: ci-mcp-bearer-token
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f action_gate/requirements.txt ]; then pip install -r action_gate/requirements.txt; fi
          if [ -f action_gate/requirements-mcp.txt ]; then pip install -r action_gate/requirements-mcp.txt; fi

      - name: Execute canonical make gates-local
        run: |
          set -o pipefail
          mkdir -p evidence/ci-gates-local
          make gates-local 2>&1 | tee evidence/ci-gates-local/gates-local.log

      - name: Upload raw gates-local output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-local-proof-${{ github.sha }}
          path: evidence/ci-gates-local/gates-local.log
          if-no-files-found: error
