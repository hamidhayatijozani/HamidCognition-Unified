name: Release Integrity — v1 Baseline

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-integrity.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify"
        required: true
        default: "action-gate-v1.0.10"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-${INPUT_TAG:-action-gate-v1.0.10}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG"             --repo "$GITHUB_REPOSITORY"             --pattern "action-gate-*.tar"             --pattern "action-gate-*.tar.sha256"             --pattern "action-gate-*.manifest.txt"             --dir release-assets
          ls -lh release-assets

      - name: Verify SHA256 sidecar against tarball
        working-directory: release-assets
        run: |
          set -euo pipefail
          SHA_FILE=$(find . -maxdepth 1 -name '*.tar.sha256' -print -quit)
          test -n "$SHA_FILE"
          sha256sum -c "$SHA_FILE"

      - name: Verify GitHub release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease             > release-metadata.json
          python - <<'PY'
          import json, os, pathlib, re
          d=json.load(open("release-metadata.json"))
          tag=d["tagName"]
          target=d["targetCommitish"]
          assert d["isDraft"] is False
          assert d["isPrerelease"] is False
          assert tag == os.environ["TAG"]
          assert re.fullmatch(r"[0-9a-f]{40}", target), target
          print(f"release={tag}")
          print(f"target_commit={target}")
          PY

      - name: Verify manifest binds release to source
        working-directory: release-assets
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          MANIFEST=$(find . -maxdepth 1 -name '*.manifest.txt' -print -quit)
          test -n "$MANIFEST"
          grep -Eiq "Verified source commit|source commit|release" "$MANIFEST"
          echo "manifest:"
          cat "$MANIFEST"

      - name: Publish verification summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "## Release integrity"
            echo ""
            echo "- tag: `$TAG`"
            echo "- tarball SHA-256: verified against the published .sha256 sidecar"
            echo "- release metadata: verified"
            echo "- manifest binding: verified for required source/release fields"
          } >> "$GITHUB_STEP_SUMMARY"
