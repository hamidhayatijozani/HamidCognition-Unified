name: Repository CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Action Gate dependencies
        run: python -m pip install -r action_gate/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q action_gate experiments
      - name: Validate Action Gate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in Path('action_gate/contracts').glob('*.json'):
              schema = json.loads(path.read_text(encoding='utf-8'))
              Draft202012Validator.check_schema(schema)
              print(f'{path}: schema PASS')
          PY
      - name: Run Action Gate test suite
        env:
          PYTHONPATH: action_gate
        run: pytest -q action_gate
      - name: Run EXP-001 structural and replay checks
        working-directory: experiments/EXP-001
        run: |
          python test_exp001.py
          python replay.py > /tmp/replay.json
          grep '"identical_fingerprints": true' /tmp/replay.json
