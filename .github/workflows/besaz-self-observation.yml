name: BESAZ Self Observation

on:
  push:
    branches: [main]
    paths-ignore:
      - data/awareness/self-observation.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  self-observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Verify awareness architecture
        run: python -m pytest -q tests/test_awareness_layer.py tests/test_awareness_supervisor.py tests/test_besaz_integration.py tests/test_besaz_self_observer.py
      - name: Run BESAZ against its own architecture
        run: python scripts/besaz_self_observe.py
      - name: Record self-observation
        run: |
          git config user.name "BESAZ Self Observer"
          git config user.email "actions@users.noreply.github.com"
          git add data/awareness/self-observation.json
          git diff --cached --quiet && exit 0
          git commit -m "BESAZ: record self-observation"
          git push
