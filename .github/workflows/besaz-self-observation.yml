name: BESAZ Self Observation

on:
  push:
    branches: [main]
    paths-ignore:
      - data/awareness/self-observation.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers-serialized
  cancel-in-progress: false

jobs:
  self-observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Verify awareness architecture
        run: python -m pytest -q tests/test_awareness_layer.py tests/test_awareness_supervisor.py tests/test_besaz_integration.py tests/test_besaz_self_observer.py
      - name: Record self-observation
        run: |
          set -euo pipefail
          git config user.name "BESAZ Self Observer"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "=== self-observation write attempt $attempt/5 ==="
            git fetch origin main
            git reset --hard origin/main
            PYTHONPATH=. python scripts/besaz_self_observe.py
            git add -f data/awareness/self-observation.json

            if git diff --cached --quiet; then
              echo "No self-observation change."
              exit 0
            fi

            git commit -m "BESAZ: record self-observation"

            if git push origin HEAD:main; then
              echo "Self-observation published successfully."
              exit 0
            fi

            echo "Main advanced concurrently; retrying from latest origin/main."
            git fetch origin main
            git reset --hard origin/main
            sleep 2
          done

          echo "Failed to publish self-observation after 5 attempts."
          exit 1
