name: Observation Boundary Evidence

on:
  push:
    branches: [main]
    paths:
      - 'action_gate/observation_boundary.py'
      - 'action_gate/test_observation_boundary.py'
      - '.github/workflows/observation-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r action_gate/requirements.txt
      - name: Run Observation Boundary tests
        working-directory: action_gate
        run: python -m pytest -q test_observation_boundary.py
      - name: Emit evidence artifact
        working-directory: action_gate
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from observation_boundary import validate_observation

          now = datetime.now(timezone.utc)
          stamp = now.isoformat()
          observation = {
              "timestamp": stamp,
              "symbol": "EURUSD",
              "bid": 1.1000,
              "ask": 1.1002,
              "tick_id": "evidence-tick-001",
              "sequence": 100,
              "broker_timestamp": stamp,
              "local_timestamp": stamp,
              "connection_status": "CONNECTED",
          }
          result = validate_observation(observation, now=now)
          evidence = {
              "schema": "observation-boundary-evidence-0.1",
              "created_at": now.isoformat(),
              "observation": observation,
              "result": result.as_dict(),
          }
          with open("observation_boundary_evidence.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, sort_keys=True, indent=2)
          assert result.permitted is True
          assert result.observation_hash
          PY
      - name: Upload Observation Boundary evidence
        uses: actions/upload-artifact@v4
        with:
          name: observation-boundary-evidence
          path: action_gate/observation_boundary_evidence.json
