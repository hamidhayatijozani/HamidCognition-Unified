name: Action Gate Authority Adversarial Tests

on:
  pull_request:
    paths:
      - "action_gate/security_authority.py"
      - "action_gate/test_security_authority_adversarial.py"
      - ".github/workflows/action-gate-authority-adversarial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-adversarial:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: action_gate
    env:
      PYTHONPATH: .
      ACTION_GATE_ENV: development
      ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
      ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
      ACTION_GATE_SIGNING_SECRET: ci-signing-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Action Gate dependencies
        run: pip install -r requirements.txt
      - name: Run authority adversarial tests
        run: pytest -q test_security_authority_adversarial.py
