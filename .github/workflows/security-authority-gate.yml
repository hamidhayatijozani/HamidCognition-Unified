name: Action Gate Security Authority Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Action Gate dependencies
        working-directory: action_gate
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run authority invariants
        run: python -m pytest -q action_gate/tests/test_security_authority.py
