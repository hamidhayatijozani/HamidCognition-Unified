name: Action Gate Security Authority Gate

on:
  push:
    branches: [main, 'feat/security-authority-v1']
    paths:
      - 'action_gate/**'
      - '.github/workflows/security-authority-gate.yml'
  pull_request:
    paths:
      - 'action_gate/**'
      - '.github/workflows/security-authority-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: action_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Action Gate dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run authority invariants
        run: python -m pytest -q tests/test_security_authority.py
