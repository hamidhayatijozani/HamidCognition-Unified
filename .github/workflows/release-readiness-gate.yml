name: Action Gate Release Readiness Gate

on:
  workflow_run:
    workflows:
      - "Action Gate Product Gates"
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  release-readiness:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all release validation workflows on the same SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # The workflow_run event is the authoritative identity of the
          # Product Gates run that triggered this gate. Do not resolve a
          # second run through a mutable API lookup: that can select an
          # unrelated older run and break the source-SHA evidence chain.
          TARGET_SHA="${{ github.event.workflow_run.head_sha }}"

          if [ -z "$TARGET_SHA" ] || [ "$TARGET_SHA" = "null" ]; then
            echo "Unable to resolve triggering workflow run SHA"
            exit 1
          fi

          echo "Release readiness target SHA: $TARGET_SHA"

          # Ordinary main commits are not release candidates. Validation on
          # every commit caused false failures when path-filtered workflows
          # legitimately did not run for that SHA. A release candidate is
          # identified by an existing action-gate-v* tag pointing at TARGET_SHA.
          tagged="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/tags" | \
            jq -r --arg sha "$TARGET_SHA" '.[] | select(.object.sha==$sha) | .ref' | \
            grep -E "^refs/tags/action-gate-v" | head -n1 || true)"
          if [ -z "$tagged" ]; then
            echo "RELEASE_READINESS_SKIP_NON_RELEASE_SHA"
            echo "validated_sha=$TARGET_SHA"
            exit 0
          fi
          echo "Release candidate tag: $tagged"

          required_workflows=(
            "Action Gate Product Gates"
            "Action Gate Product Integrity"
            "Action Gate Clean-Room Verification"
            "Action Gate Production E2E Smoke"
            "Action Gate Security Authority Gate"
            "Product Verification"
            "Security History Secret Scan"
            "Action Gate MVP"
          )

          for attempt in $(seq 1 180); do
            runs="$(curl -fsSL               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")"

            missing=0
            for workflow in "${required_workflows[@]}"; do
              count="$(printf '%s' "$runs" | jq -r --arg name "$workflow" --arg sha "$TARGET_SHA"                 '[.workflow_runs[] | select(.name==$name and .head_sha==$sha and .conclusion=="success")] | length')"
              if [ "$count" -lt 1 ]; then
                missing=1
                echo "Waiting for successful same-SHA release validation: $workflow"
              fi
            done

            if [ "$missing" -eq 0 ]; then
              echo "RELEASE_READINESS_PASS"
              echo "validated_sha=$TARGET_SHA"
              exit 0
            fi

            sleep 10
          done

          echo "RELEASE_READINESS_FAIL"
          exit 1
