name: Action Gate Release Readiness Gate

on:
  workflow_run:
    workflows:
      - "Action Gate Product Gates"
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  release-readiness:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow-control commit for the tag classifier
        uses: actions/checkout@v4
        with:
          # The classifier belongs to the workflow-control revision. The
          # Product Gates source SHA is still read separately from the event.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require all release validation workflows on the same SHA
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # The workflow_run event is the authoritative identity of the
          # Product Gates run that triggered this gate. Do not resolve a
          # second run through a mutable API lookup: that can select an
          # unrelated older run and break the source-SHA evidence chain.
          TARGET_SHA="${{ github.event.workflow_run.head_sha }}"

          if [ -z "$TARGET_SHA" ] || [ "$TARGET_SHA" = "null" ]; then
            echo "Unable to resolve triggering workflow run SHA"
            exit 1
          fi

          echo "Workflow control SHA: $GITHUB_SHA"
          echo "Product Gates source SHA: $TARGET_SHA"

          # Derive the version from the exact source commit, then resolve only
          # that version's tag. Do not scan a truncated/paginated tag list.
          version_json="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/action_gate/VERSION?ref=$TARGET_SHA")"
          VERSION="$(printf '%s' "$version_json" | jq -r '.content' | tr -d '\n' | base64 -d | tr -d '[:space:]')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid canonical version at target SHA: $VERSION"
            exit 1
          fi

          tag="action-gate-v$VERSION"
          tag_http="$(curl -sS -o /tmp/release-tag.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
          if [ "$tag_http" = "404" ]; then
            echo "RELEASE_READINESS_SKIP_NON_RELEASE_SHA"
            echo "validated_sha=$TARGET_SHA"
            echo "validated_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$tag_http" != "200" ]; then
            echo "Unable to resolve exact release tag $tag (HTTP $tag_http)"
            exit 1
          fi

          tag_type="$(jq -r '.object.type' /tmp/release-tag.json)"
          tag_sha="$(jq -r '.object.sha' /tmp/release-tag.json)"
          depth=0
          while [ "$tag_type" = "tag" ] && [ "$depth" -lt 5 ]; do
            depth=$((depth + 1))
            tag_http="$(curl -sS -o /tmp/annotated-tag.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
            if [ "$tag_http" != "200" ]; then
              echo "Unable to resolve annotated tag object $tag_sha (HTTP $tag_http)"
              exit 1
            fi
            tag_type="$(jq -r '.object.type' /tmp/annotated-tag.json)"
            tag_sha="$(jq -r '.object.sha' /tmp/annotated-tag.json)"
          done

          classification="$(python scripts/classify_release_tag_target.py "$TARGET_SHA" "$tag_type" "$tag_sha")"
          if [ "$classification" = "MISMATCH" ]; then
            echo "RELEASE_READINESS_SKIP_NON_RELEASE_SHA: $tag points to $tag_sha, not $TARGET_SHA"
            echo "validated_sha=$TARGET_SHA"
            echo "validated_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$classification" != "MATCH" ]; then
            echo "Invalid release tag classification: $classification"
            exit 1
          fi
          echo "Exact release tag verified: $tag -> $TARGET_SHA"
          required_workflows=(
            "Action Gate Product Gates"
            "Action Gate Product Integrity"
            "Action Gate Clean-Room Verification"
            "Action Gate Production E2E Smoke"
            "Action Gate Security Authority Gate"
            "Product Verification"
            "Security History Secret Scan"
            "Action Gate MVP"
          )

          for attempt in $(seq 1 180); do
            runs="$(curl -fsSL               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")"

            missing=0
            for workflow in "${required_workflows[@]}"; do
              count="$(printf '%s' "$runs" | jq -r --arg name "$workflow" --arg sha "$TARGET_SHA"                 '[.workflow_runs[] | select(.name==$name and .head_sha==$sha and .conclusion=="success")] | length')"
              if [ "$count" -lt 1 ]; then
                missing=1
                echo "Waiting for successful same-SHA release validation: $workflow"
              fi
            done

            if [ "$missing" -eq 0 ]; then
              echo "RELEASE_READINESS_PASS"
              echo "validated_sha=$TARGET_SHA"
              printf "%s\n" "$TARGET_SHA" > validated-sha.txt
              echo "validated_release=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 10
          done

          echo "RELEASE_READINESS_FAIL"
          exit 1

      - name: Publish validated source identity
        if: steps.validate.outputs.validated_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-validated-sha
          path: validated-sha.txt
          if-no-files-found: error
          retention-days: 7
