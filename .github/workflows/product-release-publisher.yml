name: Product Release Publisher

on:
  workflow_run:
    workflows: ["Action Gate Release Candidate"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release candidate artifact
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name')"
          if ! grep -q '^action-gate-release-candidate-' <<< "$artifact_names"; then
            echo "No release-candidate artifact exists; refusing to publish."
            echo "validated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release
          manifest_file="$(find release -name '*.manifest.txt' -print -quit)"
          tar_file="$(find release -name 'action-gate-*.tar' -print -quit)"
          sha_file="$(find release -name 'action-gate-*.tar.sha256' -print -quit)"
          test -f "$manifest_file" && test -f "$tar_file" && test -f "$sha_file"
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Publish product release
        if: steps.download.outputs.validated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_file="$(find release -name '*.manifest.txt' -print -quit)"
          tar_file="$(find release -name 'action-gate-*.tar' -print -quit)"
          sha_file="$(find release -name 'action-gate-*.tar.sha256' -print -quit)"
          test -f "$manifest_file" && test -f "$tar_file" && test -f "$sha_file"

          version="$(awk -F= '$1=="version"{print $2}' "$manifest_file")"
          source_sha="$(awk -F= '$1=="commit"{print $2}' "$manifest_file")"
          archive="$(awk -F= '$1=="archive"{print $2}' "$manifest_file")"
          test -n "$version"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$archive" = "$(basename "$tar_file")"

          artifact_dir="$(dirname "$manifest_file")"
          (
            cd "$artifact_dir"
            sha256sum -c "$(basename "$sha_file")"
          )

          tag="action-gate-v$version"
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null || true)"
          tag_sha=""
          if [ -n "$tag_json" ]; then
            tag_type="$(jq -r '.object.type' <<< "$tag_json")"
            tag_sha="$(jq -r '.object.sha' <<< "$tag_json")"
            if [ "$tag_type" = "tag" ]; then
              tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
            fi
            if [ "$tag_sha" != "$source_sha" ]; then
              echo "$tag already points to $tag_sha, but the artifact claims $source_sha."
              echo "Refusing to publish or relabel a mismatched release."
              exit 1
            fi
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$tag_sha" = "$source_sha"
            echo "$tag already exists at the exact artifact source SHA; nothing to publish."
            exit 0
          fi

          cat > /tmp/release-notes.md <<EOF
          HamidCognition Action Gate v$version

          Verified source commit: $source_sha
          Release-candidate workflow run: #${{ github.event.workflow_run.id }}

          The release was published by a dedicated write-scoped publisher workflow. The build/evidence workflow does not receive repository write permission.
          Commercial deployment remains subject to the customer acceptance procedure.
          EOF

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$source_sha" \
            --title "HamidCognition Action Gate v$version" \
            --notes-file /tmp/release-notes.md \
            "$tar_file" "$sha_file" "$manifest_file"
