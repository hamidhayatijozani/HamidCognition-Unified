name: Semantic Document Synchronization

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-writers-serialized
  cancel-in-progress: false

jobs:
  validate:
    name: Evidence-aware documentation consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate synchronization
        run: python tools/document_sync.py --check

      - name: Generate synchronization state
        run: python tools/document_sync.py --write-state

      - name: Run synchronization tests
        run: python -m unittest tests.test_document_sync -v

      - name: Upload synchronization state
        uses: actions/upload-artifact@v4
        with:
          name: document-sync-state
          path: evidence/document-sync-state.json

  apply-on-main:
    name: Apply deterministic documentation synchronization
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply and publish safe deterministic updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "=== documentation synchronization attempt $attempt/5 ==="
            git fetch origin main
            git reset --hard origin/main
            python tools/document_sync.py --apply-safe
            python tools/document_sync.py --check

            if git diff --quiet; then
              echo "No deterministic documentation changes."
              exit 0
            fi

            git add README.md PRODUCT/QUICKSTART.md
            git commit -m "chore(document-sync): synchronize release identity"

            if git push origin HEAD:main; then
              echo "Documentation synchronization published successfully."
              exit 0
            fi

            echo "Main advanced concurrently; retrying from latest origin/main."
            git fetch origin main
            git reset --hard origin/main
            sleep 2
          done

          echo "Failed to publish documentation synchronization after 5 attempts."
          exit 1
