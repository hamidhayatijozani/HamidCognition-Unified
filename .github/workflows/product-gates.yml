name: Action Gate Product Gates

on:
  push:
    paths:
      - 'action_gate/**'
      - '.github/workflows/product-gates.yml'
  pull_request:
    paths:
      - 'action_gate/**'
      - '.github/workflows/product-gates.yml'

permissions:
  contents: read

jobs:
  product-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Action Gate dependencies
        working-directory: action_gate
        run: pip install -r requirements.txt
      - name: Run product tests
        working-directory: action_gate
        env:
          ACTION_GATE_ENV: development
        run: pytest -q
      - name: Compile runtime
        working-directory: action_gate
        run: python -m py_compile app.py storage.py enforcement_integration.py mcp_integration.py
      - name: Validate production Compose
        working-directory: action_gate
        run: docker compose -f docker-compose.production.yml config
