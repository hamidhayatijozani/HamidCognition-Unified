name: Action Gate Product Gates

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-gates:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
      ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
      MCP_BEARER_TOKEN: ci-mcp-bearer-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Action Gate dependencies
        working-directory: action_gate
        run: pip install -r requirements.txt
      - name: Install ChatGPT MCP integration dependency
        working-directory: action_gate
        run: pip install -r requirements-mcp.txt
      - name: Run product tests
        working-directory: action_gate
        env:
          ACTION_GATE_ENV: development
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
        run: pytest -q
      - name: Verify State Oracle and Runtime Capsule integrity
        working-directory: action_gate
        env:
          ACTION_GATE_ENV: development
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
        run: |
          pytest -q test_state_oracle.py test_decision_integrity.py test_final_authority.py
          bash -n ../tools/runtime_capsule_bootstrap.sh

      - name: Run Action Gate meta-validation boundary
        working-directory: action_gate
        env:
          ACTION_GATE_ENV: development
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
        run: pytest -q test_meta_validation.py
      - name: Run Validation Boundary conformance suite
        working-directory: action_gate
        env:
          ACTION_GATE_ENV: development
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
        run: pytest -q test_validation_boundary_conformance.py --junitxml=validation-boundary-junit.xml
      - name: Run real HTTP enforcement integration
        working-directory: action_gate
        env:
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
        run: python enforcement_integration.py
      - name: Run real MCP enforcement integration
        working-directory: action_gate
        run: python mcp_integration.py
      - name: Run BESAZ awareness integration tests
        run: python -m pytest -q tests/test_awareness_layer.py tests/test_awareness_supervisor.py tests/test_besaz_integration.py

      - name: Run Agent Action Risk Lab Before/After evidence
        run: |
          python tools/run_risk_lab_demo.py | tee risk-lab-result.json
      - name: Upload Agent Action Risk Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-action-risk-lab-${{ github.run_id }}
          path: |
            artifacts/risk-lab-demo.json
            artifacts/risk-lab-demo.md
            risk-lab-result.json
          if-no-files-found: error
      - name: Run sellable product readiness gate
        working-directory: action_gate
        run: python sellable_gate.py
      - name: Compile entire Action Gate package
        run: python -m compileall -q action_gate
      - name: Install OpenAI remote MCP demo dependency
        working-directory: action_gate
        run: pip install -r requirements-openai-mcp.txt
      - name: Compile OpenAI remote MCP demo
        working-directory: action_gate
        run: python -m py_compile openai_remote_mcp_demo.py
      - name: Validate ChatGPT Quick Tunnel Compose
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          DOMAIN: localhost
          MCP_BEARER_TOKEN: ci-mcp-bearer-token
        run: docker compose -f docker-compose.production.yml -f docker-compose.chatgpt-quick-tunnel.yml config

      - name: Verify ChatGPT MCP surface imports
        working-directory: action_gate
        env:
          ACTION_GATE_URL: http://127.0.0.1:8000
          PROTECTED_TOOL_URL: http://127.0.0.1:9000
        run: python -c "import chatgpt_mcp_server; assert chatgpt_mcp_server.mcp.name == 'HamidCognition Action Gate Demo'"
      - name: Compile runtime
        working-directory: action_gate
        run: python -m py_compile app.py storage.py self_audit.py test_meta_validation.py rate_limit.py canonicalization.py keyring.py policy_store.py action_gate_sdk.py csg_contract.py csg_ingress.py csg_routes.py decision_authority.py csg_validation_handler.py agentrq_simulator.py csg_acceptance.py csg_persistence_replay.py enforcement_integration.py mcp_integration.py test_mcp_auth.py test_mcp_e2e.py test_validation_boundary_conformance.py production_e2e_smoke.py sellable_gate.py security_authority.py
      - name: Validate production Compose
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          DOMAIN: localhost
        run: docker compose -f docker-compose.production.yml config
      - name: Start production stack
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          MCP_BEARER_TOKEN: ci-mcp-bearer-token
          MCP_RESOURCE_URL: http://127.0.0.1:8787/mcp
          DOMAIN: localhost:80
        run: docker compose -f docker-compose.production.yml up -d --build
      - name: Verify production stack health before replay
        working-directory: action_gate
        env:
          POSTGRES_DB: action_gate
          POSTGRES_USER: action_gate
          POSTGRES_PASSWORD: health-postgres-placeholder
          ACTION_GATE_API_TOKEN: health-check-placeholder
          ACTION_GATE_SIGNING_SECRET: health-signing-placeholder
          ACTION_GATE_APPROVAL_SECRET: health-approval-placeholder
          ACTION_GATE_KEY_ID: hhj-action-gate-1
          ACTION_GATE_SIGNING_KEYS: "{}"
          ACTION_GATE_RATE_LIMIT_PER_MINUTE: "120"
          ACTION_GATE_DECISION_TTL_SECONDS: "300"
          ACTION_GATE_APPROVAL_TTL_SECONDS: "300"
          ACTION_GATE_POLICY_JSON: "{}"
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          DEMO_TENANT_ID: integration-tenant
          DEMO_ACTOR_ID: actor-1
          DEMO_AGENT_ID: demo
          DEMO_SESSION_ID: health-session
          MCP_BEARER_TOKEN: ci-mcp-bearer-token
          MCP_ISSUER_URL: http://127.0.0.1:8000
          MCP_RESOURCE_URL: http://127.0.0.1:8787/mcp
          MCP_REQUIRED_SCOPE: ""
          MCP_CLIENT_ID: health-check
          MCP_TOKEN_TTL_SECONDS: "300"
          DOMAIN: localhost
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            docker compose -f docker-compose.production.yml ps -a
            container_id="$(docker compose -f docker-compose.production.yml ps -q action-gate)"
            postgres_id="$(docker compose -f docker-compose.production.yml ps -q postgres)"
            if [ -n "$container_id" ] && [ -n "$postgres_id" ]; then
              gate_health="$(docker inspect -f '{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)"
              pg_health="$(docker inspect -f '{{.State.Health.Status}}' "$postgres_id" 2>/dev/null || true)"
              echo "action-gate health: ${gate_health:-unknown}; postgres health: ${pg_health:-unknown}"
              if [ "$gate_health" = "healthy" ] && [ "$pg_health" = "healthy" ]; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Production stack did not reach healthy state"
          docker compose -f docker-compose.production.yml ps -a || true
          docker compose -f docker-compose.production.yml logs --no-color --tail=500 action-gate postgres || true
          exit 1
      - name: Initialize production State Oracle
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          MCP_BEARER_TOKEN: ci-mcp-bearer-token
          DOMAIN: localhost
        run: |
          set -euo pipefail
          docker compose exec -T action-gate python - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          payload = {"world_version": "ci-production-world-v1", "snapshot": {"source": "product-gates", "status": "ready"}}
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          signature = hmac.new(os.environ["ACTION_GATE_STATE_ORACLE_SECRET"].encode(), canonical, hashlib.sha256).hexdigest()
          body = json.dumps({**payload, "oracle_signature": signature}).encode()
          req = urllib.request.Request("http://127.0.0.1:8000/v1/state/commit", data=body, headers={"Authorization": "Bearer " + os.environ["ACTION_GATE_API_TOKEN"], "Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=10) as response:
              assert response.status == 200
              print(response.read().decode())
          PY
      - name: Verify ChatGPT MCP container reachability
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          DOMAIN: localhost
        run: |
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.production.yml exec -T chatgpt-mcp python -c "import socket; s=socket.create_connection(('127.0.0.1',8787),2); s.close()" >/dev/null 2>&1; then
              echo "ChatGPT MCP listener is reachable on :8787"
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker-compose.production.yml logs --no-color chatgpt-mcp
          exit 1

      - name: Verify customer web console end-to-end
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          MCP_BEARER_TOKEN: ci-mcp-bearer-token
          DOMAIN: localhost
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --header 'Host: localhost' http://127.0.0.1/ > /tmp/customer-console.html; then
              grep -q 'HAMIDCOGNITION' /tmp/customer-console.html
              grep -q 'Action Gate' /tmp/customer-console.html
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error --header 'Host: localhost' http://127.0.0.1/api/health > /tmp/customer-console-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/customer-console-health.json').read_text())
          assert isinstance(body, dict)
          print('CUSTOMER_CONSOLE_HEALTH=', json.dumps(body, sort_keys=True))
          PY
          docker compose -f docker-compose.production.yml exec -T dashboard python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8081/'); assert r.status == 200; assert b'HAMIDCOGNITION' in r.read()"

      - name: Verify authenticated MCP boundary
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          MCP_BEARER_TOKEN: ci-mcp-bearer-token
          MCP_RESOURCE_URL: http://127.0.0.1:8787/mcp
          DOMAIN: localhost
        run: docker compose -f docker-compose.production.yml exec -T chatgpt-mcp python test_mcp_auth.py
      - name: Verify MCP ALLOW DENY EVIDENCE end-to-end
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          MCP_BEARER_TOKEN: ci-mcp-bearer-token
          MCP_RESOURCE_URL: http://127.0.0.1:8787/mcp
          DOMAIN: localhost
        run: docker compose -f docker-compose.production.yml exec -T chatgpt-mcp python test_mcp_e2e.py

      - name: Production PostgreSQL and E2E smoke
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          DOMAIN: localhost
        run: docker compose -f docker-compose.production.yml exec -T action-gate python production_e2e_smoke.py
      - name: HHJ-CSG 200-event decision replay acceptance
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          DOMAIN: localhost
          ACTION_GATE_URL: http://action-gate:8000
        run: docker compose -f docker-compose.production.yml exec -T action-gate python csg_acceptance.py
      - name: Restart Action Gate before persistence replay
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          DOMAIN: localhost
        run: |
          docker compose -f docker-compose.production.yml restart action-gate
          for attempt in $(seq 1 30); do
            container_id="$(docker compose -f docker-compose.production.yml ps -q action-gate)"
            health="$(docker inspect -f '{{.State.Health.Status}}' "$container_id")"
            echo "action-gate health: $health"
            [ "$health" = "healthy" ] && exit 0
            sleep 1
          done
          echo "action-gate did not become healthy after restart"
          exit 1
      - name: Replay 200 persisted decisions after service restart
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          DOMAIN: localhost
          ACTION_GATE_URL: http://action-gate:8000
        run: docker compose -f docker-compose.production.yml exec -T action-gate python csg_persistence_replay.py
      - name: Collect production startup diagnostics
        if: always()
        working-directory: action_gate
        run: |
          docker compose -f docker-compose.production.yml ps -a > production-startup-ps.txt 2>&1 || true
          docker compose -f docker-compose.production.yml logs --no-color --tail=1000 action-gate postgres tool enforcement > production-startup-logs.txt 2>&1 || true
          docker inspect $(docker compose -f docker-compose.production.yml ps -q action-gate 2>/dev/null || true) > production-action-gate-inspect.json 2>&1 || true

      - name: Upload production diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-diagnostics-${{ github.run_id }}
          path: |
            action_gate/production-startup-ps.txt
            action_gate/production-startup-logs.txt
            action_gate/production-action-gate-inspect.json
          if-no-files-found: warn

      - name: Collect replay evidence from production container
        if: always()
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          MCP_BEARER_TOKEN: ci-mcp-bearer-token
          DOMAIN: localhost
        run: |
          set -euo pipefail
          echo "=== production compose state before evidence collection ==="
          docker compose -f docker-compose.production.yml ps -a

          container_id="$(docker compose -f docker-compose.production.yml ps -q action-gate || true)"
          if [ -z "$container_id" ]; then
            echo "::error::Required service container 'action-gate' does not exist."
            echo "::error::Evidence cannot be collected because the production Action Gate container was never created or is no longer present."
            docker compose -f docker-compose.production.yml config
            docker compose -f docker-compose.production.yml logs --no-color --tail=500 action-gate postgres || true
            exit 1
          fi

          state="$(docker inspect -f '{{.State.Status}}' "$container_id" 2>/dev/null || true)"
          health="$(docker inspect -f '{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)"
          echo "action-gate container=$container_id state=${state:-unknown} health=${health:-unknown}"

          docker compose -f docker-compose.production.yml cp action-gate:/tmp/csg-acceptance-result.json ./csg-acceptance-result.json
          docker compose -f docker-compose.production.yml cp action-gate:/tmp/csg-persistence-replay-result.json ./csg-persistence-replay-result.json

      - name: Build validation evidence pack
        if: always()
        working-directory: action_gate
        run: |
          python - <<'PY'
          import json, os, sys
          required = ("csg-acceptance-result.json", "csg-persistence-replay-result.json", "validation-boundary-junit.xml")
          missing = [p for p in required if not os.path.exists(p)]
          if missing:
              print("MISSING_REQUIRED_EVIDENCE=" + ",".join(missing))
              sys.exit(1)
          pack = {
              "product": "HamidCognition Action Gate",
              "validation": "Action Gate Validation Boundary + HHJ-CSG Contract-First Vertical Slice",
              "repository": "hamidhayatijozani/HamidCognition-Unified",
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "commit": os.environ.get("GITHUB_SHA"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "status": "EVIDENCE_CAPTURED",
              "claim_boundary": "The product gates establish only the tested decision-to-enforcement-to-tool-to-outcome path and the HHJ-CSG contract, authenticity, idempotency and decision replay properties exercised here; they do not establish general agent safety, policy correctness, infrastructure security, or downstream outcome safety. Decision replay does not replay external world state or repeat side effects.",
          }
          for filename in ("csg-acceptance-result.json", "csg-persistence-replay-result.json"):
              with open(filename, encoding="utf-8") as f:
                  pack[filename.removesuffix(".json")] = json.load(f)
          with open("validation-evidence-pack.json", "w", encoding="utf-8") as f:
              json.dump(pack, f, indent=2, sort_keys=True)
          PY
      - name: Upload validation evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-gate-validation-evidence-${{ github.run_id }}
          path: |
            action_gate/validation-boundary-junit.xml
            action_gate/validation-evidence-pack.json
            action_gate/csg-acceptance-result.json
            action_gate/csg-persistence-replay-result.json
          if-no-files-found: error
      - name: Stop production stack
        if: always()
        working-directory: action_gate
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ACTION_GATE_API_TOKEN: ci-action-gate-token
          ACTION_GATE_SIGNING_SECRET: ci-signing-secret
          ACTION_GATE_APPROVAL_SECRET: ci-approval-secret
          ACTION_GATE_REQUIRE_SESSION_BINDING: "1"
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
          ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
          ACTION_GATE_STATE_ORACLE_SECRET: ci-state-oracle-secret
          DOMAIN: localhost
        run: docker compose -f docker-compose.production.yml down -v
