name: ClaimLab CI

on:
  push:
    paths:
      - "research/claimlab/**"
      - "tests/test_claimlab.py"
      - ".github/workflows/claimlab-ci.yml"
      - "render.yaml"
  pull_request:
    paths:
      - "research/claimlab/**"
      - "tests/test_claimlab.py"
      - ".github/workflows/claimlab-ci.yml"
      - "render.yaml"
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: claimlab
          POSTGRES_USER: claimlab
          POSTGRES_PASSWORD: claimlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimlab -d claimlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://claimlab:claimlab@127.0.0.1:5432/claimlab
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/claimlab/requirements.txt pytest
      - name: Run ClaimLab tests
        run: pytest -q tests/test_claimlab.py
      - name: Run real PostgreSQL HTTP round-trip
        run: |
          python - <<'PY'
          import json
          import threading
          import time
          import urllib.request
          import uvicorn
          from research.claimlab.http_app import app

          config = uvicorn.Config(app, host="127.0.0.1", port=8790, log_level="error")
          server = uvicorn.Server(config)
          thread = threading.Thread(target=server.run, daemon=True)
          thread.start()

          for _ in range(50):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8790/health", timeout=1) as r:
                      assert r.status == 200
                      break
              except Exception:
                  time.sleep(0.2)
          else:
              raise SystemExit("ClaimLab HTTP server did not become healthy")

          payload = {
              "id": "ci-signal-001",
              "type": "signal_snapshot",
              "timestamp": "2026-09-29T19:31:00+03:30",
              "relation": "SUPPORT",
              "source": "CI",
              "statement": "signal snapshot",
              "signals": {
                  "P": 0.72, "S": 0.61, "T": 0.38, "energy": 0.83,
                  "creativity": 0.37, "loop": False, "jump": True,
                  "escape": False, "signal": 1
              }
          }
          body = json.dumps(payload).encode()
          request = urllib.request.Request(
              "http://127.0.0.1:8790/evidence",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=5) as r:
              created = json.load(r)
          assert created["signals"] == payload["signals"]

          with urllib.request.urlopen("http://127.0.0.1:8790/evidence/ci-signal-001", timeout=5) as r:
              replayed = json.load(r)
          assert replayed["signals"] == payload["signals"]
          assert replayed["signals"]["jump"] is True
          assert replayed["evidence_type"] == "signal_snapshot"

          server.should_exit = True
          thread.join(timeout=5)
          PY

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: postgres
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Honest skip when Render hook is not configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_DEPLOY_HOOK_URL is not configured; Render deploy trigger skipped."
