name: Security Acceptance & Enforcement CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-enforcement-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest fastapi httpx uvicorn pydantic 'psycopg[binary]'

      - name: Execute canonical local gate chain
        env:
          ACTION_GATE_API_TOKEN: "test_api_token"
          ACTION_GATE_SIGNING_SECRET: "test_signing_secret"
          ACTION_GATE_APPROVAL_SECRET: "test_approval_secret"
          ACTION_GATE_AUTHORITY_SECRET: "test_authority_secret"
        run: make gates-local
