name: BESAZ Innovation Sandbox

on:
  push:
    branches: [main]
    paths-ignore:
      - data/awareness/innovation-report.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: besaz-innovation-main
  cancel-in-progress: false

jobs:
  innovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Test innovation engine
        run: pytest -q tests/test_besaz_innovation_engine.py
      - name: Generate innovation report
        run: PYTHONPATH=. python scripts/besaz_innovate.py
      - name: Record report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/awareness/innovation-report.json
          git diff --cached --quiet || git commit -m "BESAZ: record innovation sandbox report"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
