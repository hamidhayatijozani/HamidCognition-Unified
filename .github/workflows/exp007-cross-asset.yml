name: EXP-007 Cross Asset Pulse

on:
  pull_request:
    branches: [main]
    paths:
      - "RESEARCH/EXP007_CROSS_ASSET_PULSE.py"
      - ".github/workflows/exp007-cross-asset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute real-market cross-asset experiment
        run: python RESEARCH/EXP007_CROSS_ASSET_PULSE.py
      - name: Validate evidence
        run: |
          python - <<'PY'
          import json
          p=json.load(open("RESEARCH/EXP007_RESULT.json",encoding="utf-8"))
          assert p["experiment"]=="EXP-007"
          assert p["status"]=="EXECUTED_REAL_EXTERNAL_DISCOVERY"
          assert p["integrity"]["future_features_used"] is False
          assert p["integrity"]["parameter_tuning_on_evaluation"] is False
          assert p["integrity"]["windows_disjoint"] is True
          assert len(p["symbols"])==4
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp007-cross-asset-pulse
          path: RESEARCH/EXP007_RESULT.json
          if-no-files-found: error
