name: Research Evidence Gates

on:
  push:
    paths:
      - 'RESEARCH/**'
      - 'experiments/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'RESEARCH/**'
      - 'experiments/**'
      - '.github/workflows/**'

jobs:
  evidence-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate contradiction ledger
        run: python RESEARCH/CONTRADICTION_LEDGER.py
      - name: Run EXP-002 static leakage audit
        run: python experiments/EXP-002/audit.py
      - name: Run EXP-001 structural checks
        working-directory: experiments/EXP-001
        run: python test_exp001.py
      - name: Run EXP-001 replay gate
        working-directory: experiments/EXP-001
        run: |
          python replay.py > /tmp/exp001-replay.json
          grep '"identical_fingerprints": true' /tmp/exp001-replay.json
      - name: Verify EXP-003 fixture harness
        run: |
          test -f RESEARCH/EXP003EXTERNAL_REPLAY.py
          test -f RESEARCH/fixtures/externalfeed.json
      - name: Run EXP-003 fixture execution
        run: python RESEARCH/EXP003EXTERNAL_REPLAY.py
      - name: Validate EXP-003 result
        run: |
          test -f RESEARCH/EXP003RESULT.json
          python -m json.tool RESEARCH/EXP003RESULT.json
          grep '"experiment_status": "FIXTURE_EXECUTION_ONLY"' RESEARCH/EXP003RESULT.json
          grep '"external_feed_reproducibility"' RESEARCH/EXP003RESULT.json
          grep '"replay_determinism"' RESEARCH/EXP003RESULT.json
          grep '"external_feed_sensitivity"' RESEARCH/EXP003RESULT.json
      - name: Upload EXP-003 result
        uses: actions/upload-artifact@v4
        with:
          name: exp-003-result
          path: RESEARCH/EXP003RESULT.json
