name: Research Evidence Gates

on:
  push:
    paths:
      - 'RESEARCH/**'
      - 'experiments/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'RESEARCH/**'
      - 'experiments/**'
      - '.github/workflows/**'

jobs:
  evidence-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate contradiction ledger
        run: python RESEARCH/CONTRADICTION_LEDGER.py
      - name: Run EXP-002 static leakage audit
        run: python experiments/EXP-002/audit.py
      - name: Run EXP-001 structural checks
        working-directory: experiments/EXP-001
        run: python test_exp001.py
      - name: Run EXP-001 replay gate
        working-directory: experiments/EXP-001
        run: |
          python replay.py > /tmp/exp001-replay.json
          grep '"identical_fingerprints": true' /tmp/exp001-replay.json
      - name: Verify EXP-003 external snapshot harness
        run: |
          test -f RESEARCH/EXP003EXTERNAL_REPLAY.py
          test -f RESEARCH/fixtures/externalfeed.json
          python - <<'PY'
          import json
          p = json.load(open('RESEARCH/fixtures/externalfeed.json', encoding='utf-8'))
          assert p['fixture_status'] == 'EXTERNAL_SOURCE_SNAPSHOT'
          assert p['provenance']['source_type'] == 'external'
          assert p['provenance']['external_source_claimed'] is True
          assert p['provenance']['source_url']
          assert p['provenance']['retrieved_at_utc']
          assert p['provenance']['preprocessing']
          assert len(p['feed']) >= 2
          PY
      - name: Run EXP-003 real-source replay
        run: python RESEARCH/EXP003EXTERNAL_REPLAY.py
      - name: Validate EXP-003 real-source result
        run: |
          test -f RESEARCH/EXP003RESULT.json
          python -m json.tool RESEARCH/EXP003RESULT.json
          grep '"experiment_status": "REAL_EXTERNAL_SNAPSHOT_REPLAY_EXECUTED"' RESEARCH/EXP003RESULT.json
          grep '"external_source_provenance_present": true' RESEARCH/EXP003RESULT.json
          grep '"deterministic_replay": true' RESEARCH/EXP003RESULT.json
          grep '"real_external_snapshot_input_sensitivity": true' RESEARCH/EXP003RESULT.json
          grep '"result_class": "SUPPORTED_REAL_SOURCE_REPLAY_MECHANISM"' RESEARCH/EXP003RESULT.json
      - name: Run EXP-004 real-source walk-forward
        run: python RESEARCH/EXP004_WALKFORWARD.py
      - name: Validate EXP-004 result
        run: |
          test -f RESEARCH/EXP004RESULT.json
          python -m json.tool RESEARCH/EXP004RESULT.json
          grep '"experiment": "EXP-004"' RESEARCH/EXP004RESULT.json
          grep '"status": "EXECUTED_REAL_EXTERNAL_WALK_FORWARD"' RESEARCH/EXP004RESULT.json
          grep '"future_features_used": false' RESEARCH/EXP004RESULT.json
          grep '"test_tuning": false' RESEARCH/EXP004RESULT.json
          grep '"interpretation": "SURVIVES_PRELIMINARY"' RESEARCH/EXP004RESULT.json
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: exp-004-result
          path: RESEARCH/EXP004RESULT.json
