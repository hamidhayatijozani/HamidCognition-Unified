name: Research Evidence Gates

on:
  push:
    paths:
      - 'RESEARCH/**'
      - 'experiments/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'RESEARCH/**'
      - 'experiments/**'
      - '.github/workflows/**'

jobs:
  evidence-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate contradiction ledger
        run: python RESEARCH/CONTRADICTION_LEDGER.py validate
      - name: Run EXP-002 static leakage audit
        run: python experiments/EXP-002/audit.py
      - name: Run EXP-001 structural checks
        working-directory: experiments/EXP-001
        run: python test_exp001.py
      - name: Run EXP-001 replay gate
        working-directory: experiments/EXP-001
        run: |
          python replay.py > /tmp/exp001-replay.json
          grep '"identical_fingerprints": true' /tmp/exp001-replay.json
      - name: Verify EXP-003 external snapshot harness
        run: |
          test -f RESEARCH/EXP003EXTERNAL_REPLAY.py
          test -f RESEARCH/fixtures/externalfeed.json
          python - <<'PY'
          import json
          from datetime import datetime
          p = json.load(open('RESEARCH/fixtures/externalfeed.json', encoding='utf-8'))
          assert p['fixture_status'] == 'EXTERNAL_SOURCE_SNAPSHOT'
          prov = p['provenance']
          assert prov['source_type'] == 'external'
          assert prov['external_source_claimed'] is True
          assert prov['source_url']
          assert prov['retrieved_at_utc']
          datetime.fromisoformat(prov['retrieved_at_utc'].replace('Z', '+00:00'))
          assert prov['preprocessing']
          feed = p['feed']
          assert len(feed) >= 2
          assert all(row['symbol'] == 'EURUSD' for row in feed)
          assert all(isinstance(row['value'], (int, float)) for row in feed)
          PY
      - name: Run EXP-003 real-source replay
        run: python RESEARCH/EXP003EXTERNAL_REPLAY.py
      - name: Validate EXP-003 real-source result
        run: |
          test -f RESEARCH/EXP003RESULT.json
          python -m json.tool RESEARCH/EXP003RESULT.json >/dev/null
          python - <<'PY'
          import json
          p = json.load(open('RESEARCH/EXP003RESULT.json', encoding='utf-8'))
          assert p['experiment'] == 'EXP-003'
          assert p['experiment_status'] == 'REAL_EXTERNAL_SNAPSHOT_REPLAY_EXECUTED'
          assert p['fixture_status'] == 'EXTERNAL_SOURCE_SNAPSHOT'
          assert p['tests']['fixture_integrity'] is True
          assert p['tests']['external_source_provenance_present'] is True
          assert p['tests']['deterministic_replay'] is True
          assert p['tests']['real_external_snapshot_input_sensitivity'] is True
          assert p['result_class'] == 'SUPPORTED_REAL_SOURCE_REPLAY_MECHANISM'
          assert p['runs']['run_a']['fingerprint'] == p['runs']['run_b']['fingerprint']
          assert p['runs']['run_a']['fingerprint'] != p['runs']['run_c_modified_input']['fingerprint']
          forbidden = {'external_world_reproducibility', 'scientific_validity_of_external_feed_behavior', 'reproduction_of_external_provider_internal_process', 'predictive_skill_or_trading_value'}
          assert forbidden.issubset(set(p['claims_not_verified']))
          PY
      - name: Run EXP-004 real-source walk-forward
        run: python RESEARCH/EXP004_WALKFORWARD.py
      - name: Validate EXP-004 result
        run: |
          test -f RESEARCH/EXP004RESULT.json
          python - <<'PY'
          import json
          p = json.load(open('RESEARCH/EXP004RESULT.json', encoding='utf-8'))
          assert p['experiment'] == 'EXP-004'
          assert p['status'] == 'EXECUTED_REAL_EXTERNAL_WALK_FORWARD'
          assert p['integrity']['future_features_used'] is False
          assert p['integrity']['test_tuning'] is False
          assert p['integrity']['snapshots_disjoint'] is True
          assert p['interpretation'] in {'SURVIVES_PRELIMINARY', 'FAILS_PRIMARY_GATE'}
          expected_promotion = {
              'SURVIVES_PRELIMINARY': 'BLOCKED_PENDING_INDEPENDENT_REPRODUCTION',
              'FAILS_PRIMARY_GATE': 'CLAIM_FALSIFIED_UNDER_PREREGISTERED_GATE',
          }[p['interpretation']]
          assert p['promotion'] == expected_promotion
          if p['interpretation'] == 'FAILS_PRIMARY_GATE':
              assert p['primary_summary']['all_snapshots_positive'] is False
              assert all(delta <= 0 for delta in p['primary_summary']['snapshot_deltas_vs_majority'])
          assert len(p['snapshots']) == 2
          for s in p['snapshots'].values():
              assert s['raw_sha256'] and s['observations'] >= 500
          PY
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-004-result
          path: RESEARCH/EXP004RESULT.json
          if-no-files-found: error
