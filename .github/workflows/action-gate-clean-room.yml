name: Action Gate Clean-Room Verification
on:
  push:
    branches: [main]
  pull_request:
    paths: ['action_gate/**','MODEL/**','PRODUCT/**','scripts/verify_model_weight_registry.py','.github/workflows/action-gate-clean-room.yml']
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact source SHA to verify'
        required: false
        type: string
permissions:
  contents: read
jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Runner preflight
        run: |
          set -euo pipefail
          echo "runner=$RUNNER_NAME"
          echo "event=$GITHUB_EVENT_NAME"
          echo "workflow_sha=$GITHUB_SHA"
          echo "expected_sha=$EXPECTED_SHA"
          test -n "$EXPECTED_SHA"
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$actual" = "$GITHUB_SHA"
          fi
      - name: Verify model-weight registry
        run: python3 scripts/verify_model_weight_registry.py
      - name: Reject unregistered model-weight binaries
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.safetensors' -o -name '*.gguf' -o -name '*.onnx' -o -name '*.pt' -o -name '*.pth' -o -name '*.ckpt' -o -name '*.h5' \) -not -path './.git/*' | grep -q .; then
            echo "Unregistered model-weight binary detected."
            exit 1
          fi
      - name: Verify canonical product version
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < action_gate/VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Resolve and lock Python dependencies
        run: |
          set -euo pipefail
          python3 -m venv .clean-room-venv
          . .clean-room-venv/bin/activate
          python -m pip install --upgrade 'pip<26'
          python -m pip install 'pip-tools>=7,<8'
          pip-compile --generate-hashes action_gate/requirements.txt --output-file action_gate/requirements.lock
          python -m pip install --require-hashes -r action_gate/requirements.lock
          python -m pip freeze > clean-room-host-pip-freeze.txt
      - name: Verify source tests
        run: |
          set -euo pipefail
          . .clean-room-venv/bin/activate
          export PYTHONPATH="$GITHUB_WORKSPACE/action_gate"
          python -m compileall -q action_gate
          python -m pytest -q
      - name: Verify product integrity
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < action_gate/VERSION)"
          test -f PRODUCT/ACTION_GATE_PRODUCT_SPEC.md
          test -f PRODUCT/COMMERCIAL_READINESS.md
          test -f PRODUCT/CUSTOMER_ACCEPTANCE.md
          test -f PRODUCT/RELEASE_NOTES_$version.md
          test -f PRODUCT/DEPLOYMENT.md
          test -f PRODUCT/INTEGRATION_CONTRACT.md
          test -f PRODUCT/OPERATIONS_RUNBOOK.md
          test -f PRODUCT/RELEASE_CHECKLIST.md
          test -f PRODUCT/.env.example
          grep -q '^ACTION_GATE_PRODUCTION_EXECUTION=false$' PRODUCT/.env.example
      - name: Build final container
        run: |
          set -euo pipefail
          docker pull python:3.12-slim
          base_ref="$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')"
          base_digest="$(printf '%s' "$base_ref" | cut -d@ -f2)"
          echo "$base_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s\n' "$base_digest" > clean-room-base-image-digest.txt
          docker build --build-arg BASE_IMAGE_DIGEST="$base_digest" -f action_gate/Dockerfile -t action-gate-clean-room:${ steps.version.outputs.version }} action_gate
          docker image inspect action-gate-clean-room:${ steps.version.outputs.version }} --format 'image_id={{.Id}}' | tee clean-room-image.txt
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}' | tee clean-room-base-image-digests.json
      - name: Verify final container runtime
        run: |
          set -euo pipefail
          image="action-gate-clean-room:${ steps.version.outputs.version }}"
          docker run --rm "$image" python -m pip check
          docker run --rm "$image" python -m pip freeze | tee clean-room-container-pip-freeze.txt
          docker run --rm "$image" python -m compileall -q /app
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src "$image" env PYTHONPATH=/src/action_gate python -m pytest -q
      - name: Emit deterministic evidence
        run: |
          set -euo pipefail
          mkdir -p clean-room-evidence
          version="$(tr -d '[:space:]' < action_gate/VERSION)"
          export VERSION="$version"
          lock_sha="$(sha256sum action_gate/requirements.lock | awk '{print $1}')"
          container_freeze_sha="$(sha256sum clean-room-container-pip-freeze.txt | awk '{print $1}')"
          registry_sha="$(sha256sum MODEL/WEIGHT_REGISTRY.json | awk '{print $1}')"
          image_id="$(sed 's/^image_id=//' clean-room-image.txt)"
          base_digest="$(cat clean-room-base-image-digest.txt)"
          printf 'product=Action Gate\nversion=%s\ncommit=%s\nexpected_sha=%s\nrun_id=%s\nrun_url=%s/%s/actions/runs/%s\ncontainer_image_id=%s\nbase_image_digest=%s\nrequirements_lock_sha256=%s\ncontainer_pip_freeze_sha256=%s\nmodel_weight_registry_sha256=%s\n' "$version" "$GITHUB_SHA" "$EXPECTED_SHA" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$image_id" "$base_digest" "$lock_sha" "$container_freeze_sha" "$registry_sha" > clean-room-evidence/manifest.txt
          python3 - <<'PY'
          import hashlib, json, os
          def sha(p): return hashlib.sha256(open(p,'rb').read()).hexdigest()
          d={"product":"Action Gate","version":os.environ["VERSION"],"commit_sha":os.environ["GITHUB_SHA"],"expected_sha":os.environ["EXPECTED_SHA"],"workflow_run_id":os.environ["GITHUB_RUN_ID"],"container_image_id":open("clean-room-image.txt").read().strip().removeprefix("image_id="),"base_image_digest":open("clean-room-base-image-digest.txt").read().strip(),"requirements_lock_sha256":sha("action_gate/requirements.lock"),"container_pip_freeze_sha256":sha("clean-room-container-pip-freeze.txt"),"model_weight_registry_sha256":sha("MODEL/WEIGHT_REGISTRY.json")}
          json.dump(d,open("clean-room-evidence/attestation.json","w"),indent=2,sort_keys=True)
          PY
          cp action_gate/requirements.lock clean-room-evidence/requirements.lock
          cp clean-room-container-pip-freeze.txt clean-room-evidence/container-pip-freeze.txt
          cp clean-room-image.txt clean-room-evidence/container-image.txt
          cp clean-room-base-image-digests.json clean-room-evidence/base-image-digests.json
          cp clean-room-base-image-digest.txt clean-room-evidence/base-image-digest.txt
          sha256sum clean-room-evidence/manifest.txt > clean-room-evidence/manifest.sha256
          sha256sum clean-room-evidence/attestation.json > clean-room-evidence/attestation.sha256
          sha256sum clean-room-evidence/requirements.lock > clean-room-evidence/requirements.lock.sha256
          sha256sum clean-room-evidence/container-pip-freeze.txt > clean-room-evidence/container-pip-freeze.sha256
          tar -czf clean-room-evidence.tar.gz clean-room-evidence
          sha256sum clean-room-evidence.tar.gz > clean-room-evidence.tar.gz.sha256
      - name: Upload clean-room evidence
        uses: actions/upload-artifact@v4
        with:
          name: action-gate-clean-room-evidence-${ steps.version.outputs.version }}-${ github.sha }}
          path: |
            clean-room-evidence.tar.gz
            clean-room-evidence.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
