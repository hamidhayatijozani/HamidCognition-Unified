name: Action Gate Clean-Room Verification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'action_gate/**'
      - 'PRODUCT/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/action-gate-clean-room.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact source SHA to verify (defaults to checked-out revision)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACTION_GATE_AUTHORITY_SECRET: ci-authority-secret
      ACTION_GATE_SIGNING_SECRET: ci-signing-secret
      EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Runner preflight and source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "event=$GITHUB_EVENT_NAME"
          echo "workflow_sha=$GITHUB_SHA"
          echo "expected_sha=$EXPECTED_SHA"
          test -n "$EXPECTED_SHA"

      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "verified_source_sha=$actual"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$actual" = "$GITHUB_SHA"
            echo "verified_release_main_head=$actual"
          else
            echo "verification_mode=candidate"
          fi

      - name: Verify direct main-head execution
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          echo "verified_main_head=$GITHUB_SHA"
          echo "clean_room_head_sha=$GITHUB_SHA"

      - name: Verify canonical product version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test -f action_gate/VERSION
          version="$(tr -d '[:space:]' < action_gate/VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .clean-room-venv
          . .clean-room-venv/bin/activate
          python -m pip install --upgrade 'pip<26'
          python --version
          python -m pip --version
          if test -f action_gate/requirements.txt; then
            python -m pip install -r action_gate/requirements.txt
          elif test -f requirements.txt; then
            python -m pip install -r requirements.txt
          elif test -f pyproject.toml || test -f setup.py; then
            python -m pip install -e .
          fi
          python -m pip install 'pytest>=8,<9'
          python -m pip freeze > clean-room-evidence-pip-freeze.txt

      - name: Compile runtime
        shell: bash
        run: |
          set -euo pipefail
          . .clean-room-venv/bin/activate
          python -m compileall -q action_gate

      - name: Run repository tests
        shell: bash
        run: |
          set -euo pipefail
          . .clean-room-venv/bin/activate
          export PYTHONPATH="$GITHUB_WORKSPACE/action_gate:$GITHUB_WORKSPACE"
          if find action_gate tests -maxdepth 3 -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pytest -q action_gate tests
          else
            echo "No Action Gate product test files discovered in the clean checkout."
          fi

      - name: Verify product integrity contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < action_gate/VERSION)"
          required=(
            PRODUCT/ACTION_GATE_PRODUCT_SPEC.md
            PRODUCT/COMMERCIAL_READINESS.md
            PRODUCT/CUSTOMER_ACCEPTANCE.md
            PRODUCT/RELEASE_NOTES_${version}.md
            PRODUCT/DEPLOYMENT.md
            PRODUCT/INTEGRATION_CONTRACT.md
            PRODUCT/OPERATIONS_RUNBOOK.md
            PRODUCT/RELEASE_CHECKLIST.md
            PRODUCT/.env.example
          )
          for f in "${required[@]}"; do test -f "$f"; done
          grep -q '^ACTION_GATE_PRODUCTION_EXECUTION=false$' PRODUCT/.env.example
          if grep -Eiq '(sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' PRODUCT/.env.example; then
            echo "Obvious secret pattern detected in .env.example"
            exit 1
          fi

      - name: Resolve immutable Python base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-slim
          digest="$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')"
          test -n "$digest"
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "$digest" > clean-room-base-image.txt
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}' | tee clean-room-base-image-digests.json

      - name: Build production container from immutable base
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false --build-arg PYTHON_BASE_IMAGE="${{ steps.base.outputs.image }}" -f action_gate/Dockerfile -t action-gate-clean-room:${{ steps.version.outputs.version }} .
          docker image inspect action-gate-clean-room:${{ steps.version.outputs.version }} --format 'image_id={{.Id}}' | tee clean-room-image.txt

      - name: Emit verification manifest and attestation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clean-room-evidence
          version="$(tr -d '[:space:]' < action_gate/VERSION)"
          verified_source_sha="$(git rev-parse HEAD)"
          test "$verified_source_sha" = "$EXPECTED_SHA"
          container_image_id="$(sed 's/^image_id=//' clean-room-image.txt)"
          base_image_digests="$(cat clean-room-base-image-digests.json)"
          pip_freeze_sha256="$(sha256sum clean-room-evidence-pip-freeze.txt | awk '{print $1}')"
          timestamp_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "product=Action Gate"
            echo "version=$version"
            echo "commit=$verified_source_sha"
            echo "github_sha=$GITHUB_SHA"
            echo "expected_sha=$EXPECTED_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "python=$(python3 --version)"
            echo "docker=$(docker --version)"
            echo "pip_freeze_sha256=$pip_freeze_sha256"
            echo "container_image_id=$container_image_id"
            echo "base_image_digests=$base_image_digests"
            echo "timestamp_utc=$timestamp_utc"
            echo "verification=clean-room"
          } > clean-room-evidence/manifest.txt
          export PIP_FREEZE_SHA256="$pip_freeze_sha256"
          export CONTAINER_IMAGE_ID="$container_image_id"
          export BASE_IMAGE_DIGESTS="$base_image_digests"
          export TIMESTAMP_UTC="$timestamp_utc"
          export VERIFIED_SOURCE_SHA="$verified_source_sha"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          attestation = {
              "product": "Action Gate",
              "version": Path("action_gate/VERSION").read_text().strip(),
              "commit_sha": os.environ["VERIFIED_SOURCE_SHA"],
              "github_sha": os.environ["GITHUB_SHA"],
              "expected_sha": os.environ["EXPECTED_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "pip_freeze_sha256": os.environ["PIP_FREEZE_SHA256"],
              "container_image_id": os.environ["CONTAINER_IMAGE_ID"],
              "base_image_digests": json.loads(os.environ["BASE_IMAGE_DIGESTS"]),
              "timestamp_utc": os.environ["TIMESTAMP_UTC"],
              "verification": "clean-room"
          }
          Path("clean-room-evidence/attestation.json").write_text(json.dumps(attestation, indent=2) + "\n")
          PY
          sha256sum clean-room-evidence/manifest.txt > clean-room-evidence/manifest.sha256
          sha256sum clean-room-evidence/attestation.json > clean-room-evidence/attestation.sha256
          cp clean-room-evidence-pip-freeze.txt clean-room-evidence/pip-freeze.txt
          cp clean-room-image.txt clean-room-evidence/container-image.txt
          cp clean-room-base-image-digests.json clean-room-evidence/base-image-digests.json
          sha256sum clean-room-evidence/pip-freeze.txt > clean-room-evidence/pip-freeze.sha256
          sha256sum clean-room-evidence/container-image.txt > clean-room-evidence/container-image.sha256
          sha256sum clean-room-evidence/base-image-digests.json > clean-room-evidence/base-image-digests.sha256
          tar -czf clean-room-evidence.tar.gz clean-room-evidence
          sha256sum clean-room-evidence.tar.gz | tee clean-room-evidence.tar.gz.sha256

      - name: Upload clean-room evidence
        uses: actions/upload-artifact@v4
        with:
          name: action-gate-clean-room-evidence-${{ steps.version.outputs.version }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            clean-room-evidence.tar.gz
            clean-room-evidence.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
