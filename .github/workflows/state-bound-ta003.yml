name: State-Bound TA-003 State Drift

on:
  push:
    paths:
      - "state_bound/**"
      - "tests/test_ta003_state_drift.py"
      - ".github/workflows/state-bound-ta003.yml"
  workflow_dispatch:

concurrency:
  group: state-bound-ta003
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ta003:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run TA-001 through TA-003 regression tests
        run: python -m pytest -q tests/test_state_bound.py tests/test_ta002_context_drift.py tests/test_ta003_state_drift.py
      - name: Run TA-003 benchmark
        run: python -m state_bound.ta003 | tee /tmp/ta003.json
      - name: Publish benchmark summary
        run: cat /tmp/ta003.json >> "$GITHUB_STEP_SUMMARY"
