name: Action Gate Product Integrity

on:
  push:
    paths:
      - "action_gate/**"
      - "PRODUCT/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/action-gate-product-integrity.yml"
  pull_request:
    paths:
      - "action_gate/**"
      - "PRODUCT/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/action-gate-product-integrity.yml"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical version file
        shell: bash
        run: |
          test -s action_gate/VERSION
          VERSION="$(tr -d '[:space:]' < action_gate/VERSION)"
          test -n "$VERSION"

      - name: Compile Python runtime
        shell: bash
        run: python -m compileall -q action_gate

      - name: Check product package
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < action_gate/VERSION)"
          required=(
            PRODUCT/ACTION_GATE_PRODUCT_SPEC.md
            PRODUCT/COMMERCIAL_READINESS.md
            PRODUCT/CUSTOMER_ACCEPTANCE.md
            "PRODUCT/RELEASE_NOTES_${VERSION}.md"
            PRODUCT/DEPLOYMENT.md
            PRODUCT/INTEGRATION_CONTRACT.md
            PRODUCT/OPERATIONS_RUNBOOK.md
            PRODUCT/RELEASE_CHECKLIST.md
            PRODUCT/.env.example
          )
          for file in "${required[@]}"; do
            echo "Checking required product file: $file"
            test -s "$file"
          done

      - name: Reject obvious secret placeholders in product template
        shell: bash
        run: |
          if grep -Eiq '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' PRODUCT/.env.example; then
            echo "Potential credential material found in example configuration."
            exit 1
          fi

      - name: Validate environment template is non-production
        shell: bash
        run: |
          grep -q '^ACTION_GATE_PRODUCTION_EXECUTION=false$' PRODUCT/.env.example
          grep -q 'REPLACE_IN_SECRET_MANAGER' PRODUCT/.env.example
