name: Publish Action Gate demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "demo-v0.4.2.html"
      - ".github/workflows/publish-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep this deployment compatible with web-app-pages.yml: both workflows
# publish the same repository-root site so neither overwrites the other with
# a demo-only index page.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
