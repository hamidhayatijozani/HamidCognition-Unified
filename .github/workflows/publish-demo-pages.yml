name: Validate Action Gate demo assets

on:
  push:
    branches: [main]
    paths:
      - "demo-v0.4.2.html"
      - ".github/workflows/publish-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Deliberately validation-only. web-app-pages.yml is the sole Pages deployer.
jobs:
  validate-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate demo file and release video links
        shell: bash
        run: |
          set -euo pipefail
          test -s demo-v0.4.2.html
          grep -q '882e5530-c605-11f1-a7f9-3bbec7cadd5d.mp4' demo-v0.4.2.html
          grep -q '6cdf0500-c604-11f1-a7f9-3bbec7cadd5d.mp4' demo-v0.4.2.html
          for asset in \
            "https://github.com/hamidhayatijozani/HamidCognition-Unified/releases/download/v0.4.2/882e5530-c605-11f1-a7f9-3bbec7cadd5d.mp4" \
            "https://github.com/hamidhayatijozani/HamidCognition-Unified/releases/download/v0.4.2/6cdf0500-c604-11f1-a7f9-3bbec7cadd5d.mp4"
          do
            curl --fail --location --silent --show-error --output /dev/null --range 0-0 "$asset"
          done
