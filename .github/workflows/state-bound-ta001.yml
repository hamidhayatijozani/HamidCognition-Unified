name: State-Bound TA-001

on:
  pull_request:
    paths:
      - "state_bound/**"
      - "tests/test_state_bound.py"
      - "tests/test_ta001_benchmark.py"
      - "tests/test_trajectory_reality.py"
      - ".github/workflows/state-bound-ta001.yml"
  push:
    paths:
      - "state_bound/**"
      - "tests/test_state_bound.py"
      - "tests/test_ta001_benchmark.py"
      - ".github/workflows/state-bound-ta001.yml"
  workflow_dispatch:

jobs:
  ta001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run TA-001 tests and meta-test
        run: python -m pytest -q tests/test_state_bound.py tests/test_ta001_benchmark.py tests/test_trajectory_reality.py
      - name: Run TA-001 benchmark
        run: python -m state_bound.benchmark | tee /tmp/ta001.json
      - name: Publish benchmark summary
        run: cat /tmp/ta001.json >> "$GITHUB_STEP_SUMMARY"
