name: Web App — GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "demo-v0.4.2.html"
      - ".github/workflows/web-app-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# This is the only workflow allowed to deploy the repository-root Pages site.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
