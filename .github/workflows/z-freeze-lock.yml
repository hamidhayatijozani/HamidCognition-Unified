name: Z-FREEZE-LOCK CI

on:
  push:
    paths:
      - "src/z_freeze_lock.py"
      - "tests/test_z_freeze_lock.py"
      - "schemas/z-freeze-lock.command.schema.json"
      - "docs/Z-FREEZE-LOCK-v2.md"
  pull_request:
    paths:
      - "src/z_freeze_lock.py"
      - "tests/test_z_freeze_lock.py"
      - "schemas/z-freeze-lock.command.schema.json"
      - "docs/Z-FREEZE-LOCK-v2.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_z_freeze_lock.py
