name: MCP Ephemeral HTTPS E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "action_gate/chatgpt_mcp_server.py"
      - "action_gate/docker-compose.production.yml"
      - "action_gate/docker-compose.chatgpt-quick-tunnel.yml"
      - "scripts/mcp_e2e_smoke.py"
      - ".github/workflows/mcp-ephemeral-e2e.yml"

permissions:
  contents: read

jobs:
  ephemeral-mcp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: e2e-postgres-password
      ACTION_GATE_API_TOKEN: e2e-action-gate-token
      ACTION_GATE_SIGNING_SECRET: e2e-signing-secret
      ACTION_GATE_APPROVAL_SECRET: e2e-approval-secret
      ACTION_GATE_AUTHORITY_SECRET: e2e-authority-secret
      MCP_BEARER_TOKEN: e2e-mcp-bearer-token
      MCP_ISSUER_URL: https://e2e.invalid
      MCP_RESOURCE_URL: https://e2e.invalid/mcp
      MCP_REQUIRED_SCOPE: mcp:execute
      MCP_CLIENT_ID: hamidcognition-e2e
      DOMAIN: localhost

    steps:
      - uses: actions/checkout@v4

      - name: Build and start production stack with ephemeral tunnel
        run: |
          docker compose             -f action_gate/docker-compose.production.yml             -f action_gate/docker-compose.chatgpt-quick-tunnel.yml             up -d --build

      - name: Wait for PostgreSQL, Action Gate and MCP readiness
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if docker compose               -f action_gate/docker-compose.production.yml               -f action_gate/docker-compose.chatgpt-quick-tunnel.yml               exec -T postgres pg_isready -U action_gate -d action_gate >/dev/null 2>&1 &&               docker compose               -f action_gate/docker-compose.production.yml               -f action_gate/docker-compose.chatgpt-quick-tunnel.yml               exec -T action-gate python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker compose                 -f action_gate/docker-compose.production.yml                 -f action_gate/docker-compose.chatgpt-quick-tunnel.yml                 logs --no-color action-gate
              exit 1
            fi
            sleep 2
          done

      - name: Wait for MCP and discover public HTTPS endpoint
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            url="$(
              docker compose                 -f action_gate/docker-compose.production.yml                 -f action_gate/docker-compose.chatgpt-quick-tunnel.yml                 logs chatgpt-quick-tunnel 2>&1                 | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | grep -v '^https://api\.trycloudflare\.com$'                 | head -n1 || true
            )"
            if [ -n "$url" ]; then
              endpoint="$url/mcp"
              host="$(printf '%s' "$url" | sed -E 's#https://([^/]+).*#\1#')"
              echo "Discovered MCP endpoint: $endpoint"
              echo "Waiting for public DNS/HTTPS propagation for $host..."
              for j in {1..30}; do
                if getent hosts "$host" >/dev/null 2>&1; then
                  http_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 "$endpoint" || true)"
                  case "$http_code" in
                    2??|3??|4??)
                      echo "Public MCP endpoint is reachable (HTTP $http_code)."
                      {
                        echo "MCP_E2E_URL=$endpoint"
                        echo "MCP_E2E_BEARER_TOKEN=$MCP_BEARER_TOKEN"
                      } >> "$GITHUB_ENV"
                      echo "url=$endpoint" >> "$GITHUB_OUTPUT"
                      exit 0
                      ;;
                  esac
                fi
                sleep 2
              done
              echo "Tunnel URL was discovered but never became DNS/HTTPS reachable: $endpoint"
              docker compose                 -f action_gate/docker-compose.production.yml                 -f action_gate/docker-compose.chatgpt-quick-tunnel.yml                 logs --no-color chatgpt-quick-tunnel
              exit 1
            fi
            sleep 2
          done
          docker compose             -f action_gate/docker-compose.production.yml             -f action_gate/docker-compose.chatgpt-quick-tunnel.yml             logs --no-color chatgpt-quick-tunnel
          exit 1

      - name: Verify E2E environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MCP_E2E_URL:-}" || { echo "MCP_E2E_URL is empty"; exit 1; }
          test -n "${MCP_E2E_BEARER_TOKEN:-}" || { echo "MCP_E2E_BEARER_TOKEN is empty"; exit 1; }
          case "$MCP_E2E_URL" in
            https://*.trycloudflare.com/mcp) ;;
            *) echo "Unexpected MCP_E2E_URL: $MCP_E2E_URL"; exit 1 ;;
          esac
          echo "MCP E2E environment is ready."

      - name: Run external HTTPS MCP E2E
        shell: bash
        run: |
          set -o pipefail
          : > mcp-e2e-result.json
          for attempt in {1..8}; do
            echo "MCP E2E attempt $attempt/8"
            url="$(
              docker compose                 -f action_gate/docker-compose.production.yml                 -f action_gate/docker-compose.chatgpt-quick-tunnel.yml                 logs chatgpt-quick-tunnel 2>&1                 | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | grep -v '^https://api\.trycloudflare\.com$'                 | tail -n1 || true
            )"
            if [ -z "$url" ]; then
              echo "No current Quick Tunnel URL found."
              sleep 5
              continue
            fi
            endpoint="$url/mcp"
            host="$(printf '%s' "$url" | sed -E 's#https://([^/]+).*#\1#')"
            echo "Current tunnel endpoint: $endpoint"
            if ! getent hosts "$host" >/dev/null 2>&1; then
              echo "Tunnel hostname is not currently resolvable: $host"
              sleep 5
              continue
            fi
            http_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 "$endpoint" || true)"
            case "$http_code" in
              2??|3??|4??) ;;
              *) echo "MCP endpoint is not currently reachable (HTTP $http_code): $endpoint"; sleep 5; continue ;;
            esac
            export MCP_E2E_URL="$endpoint"
            export MCP_E2E_BEARER_TOKEN="$MCP_BEARER_TOKEN"
            if python3 scripts/mcp_e2e_smoke.py 2>&1 | tee mcp-e2e-result.json; then
              exit 0
            fi
            echo "MCP E2E attempt $attempt failed; re-reading tunnel URL before retry..."
            sleep 5
          done
          echo "MCP E2E failed after 8 attempts."
          exit 1

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-ephemeral-e2e-evidence
          path: mcp-e2e-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Collect service diagnostics
        if: always()
        run: |
          docker compose             -f action_gate/docker-compose.production.yml             -f action_gate/docker-compose.chatgpt-quick-tunnel.yml             ps
          docker compose             -f action_gate/docker-compose.production.yml             -f action_gate/docker-compose.chatgpt-quick-tunnel.yml             logs --no-color --tail=200 chatgpt-mcp action-gate tool chatgpt-quick-tunnel || true

      - name: Tear down
        if: always()
        run: |
          docker compose             -f action_gate/docker-compose.production.yml             -f action_gate/docker-compose.chatgpt-quick-tunnel.yml             down -v
