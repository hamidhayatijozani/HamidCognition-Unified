name: Governance Release

on:
  workflow_run:
    workflows: ["Master Evidence Gate"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create governance release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.0.0 already exists; nothing to create."
            exit 0
          fi
          cat > /tmp/release-notes.md <<EOF
          Certified Governance Release for HamidCognition v2.0.0.

          Validation workflow run: #$RUN_ID
          Validated commit: $HEAD_SHA

          The validation workflow is read-only against repository contents. Release publication is isolated to this workflow.
          EOF
          gh release create v2.0.0             --repo "$GITHUB_REPOSITORY"             --target "$HEAD_SHA"             --title "HamidCognition v2.0.0 - Certified Governance Release"             --notes-file /tmp/release-notes.md
