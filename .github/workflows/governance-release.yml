name: Governance Release

on:
  workflow_run:
    workflows: ["Master Evidence Gate"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create evidence-bound release
        env:
          GH_TOKEN: $GITHUB_TOKEN
          RUN_ID: $GITHUB_RUN_ID
          HEAD_SHA: $GITHUB_SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "Evidence-bound release workflow"
          echo "This workflow must only publish after Master Evidence Gate succeeds."
