name: Governance Release

on:
  workflow_run:
    workflows: ["Master Evidence Gate"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create evidence-bound release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Evidence-bound release workflow"
          echo "master_evidence_run_id=$RUN_ID"
          echo "validated_source_sha=$HEAD_SHA"
          echo "No unsupported certification claim is emitted."
