name: Product Gate Evidence

on:
  push:
    branches: [main]
    paths:
      - 'action_gate/product_gate.py'
      - 'action_gate/test_product_gate.py'
      - '.github/workflows/product-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r action_gate/requirements.txt
      - name: Run Product Gate tests
        working-directory: action_gate
        run: python -m pytest -q test_product_gate.py
      - name: Emit evidence artifact
        working-directory: action_gate
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from product_gate import evaluate_product_gate

          now = datetime.now(timezone.utc)
          proposal = {
              "action": "BUY_SMALL",
              "model_version": "evidence-model-001",
              "feature_version": "evidence-features-001",
              "input_hash": "evidence-input-001",
          }
          observation = {
              "timestamp": now.isoformat(),
              "connection_status": "CONNECTED",
              "input_hash": "evidence-input-001",
              "anomaly_score": 0.10,
              "drawdown": 0.02,
          }
          result = evaluate_product_gate(proposal, observation, now=now)
          evidence = {
              "schema": "product-gate-evidence-0.1",
              "created_at": now.isoformat(),
              "proposal": proposal,
              "observation": observation,
              "result": result.as_dict(),
          }
          with open("product_gate_evidence.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, sort_keys=True, indent=2)
          assert result.permitted is True
          PY
      - name: Upload Product Gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: product-gate-evidence
          path: action_gate/product_gate_evidence.json
