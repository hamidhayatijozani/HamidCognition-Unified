name: Action Gate MVP

permissions:
  contents: read

on:
  push:
    paths:
      - 'action_gate/**'
      - '.github/workflows/action-gate-mvp.yml'
  pull_request:
    paths:
      - 'action_gate/**'
      - '.github/workflows/action-gate-mvp.yml'

jobs:
  mvp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: action_gate
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: nohup env ACTION_GATE_API_TOKEN=ci-test-token uvicorn app:app --host 127.0.0.1 --port 8000 >/tmp/action-gate.log 2>&1 &
      - name: Wait for demo server
        run: |
          python - <<'PY'
          import socket, time
          deadline = time.monotonic() + 15
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8000), timeout=0.5):
                      break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit("Action Gate demo server did not become ready")
          PY
      - run: python demo.py
        env:
          ACTION_GATE_API_TOKEN: ci-test-token
      - name: Stop demo server before isolated integration
        run: pkill -f 'uvicorn app:app --host 127.0.0.1 --port 8000' || true
      - run: python enforcement_integration.py
        env:
          ACTION_GATE_API_TOKEN: ci-test-token
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
      - run: python mcp_integration.py
        env:
          ACTION_GATE_API_TOKEN: ci-test-token
          ACTION_GATE_ENFORCEMENT_SECRET: ci-enforcement-secret
