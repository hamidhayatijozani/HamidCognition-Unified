name: Action Gate MVP

on:
  push:
    paths:
      - 'action_gate/**'
      - '.github/workflows/action-gate-mvp.yml'
  pull_request:
    paths:
      - 'action_gate/**'
      - '.github/workflows/action-gate-mvp.yml'

jobs:
  mvp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: action_gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: nohup uvicorn app:app --host 127.0.0.1 --port 8000 >/tmp/action-gate.log 2>&1 &
      - run: sleep 2 && python demo.py
