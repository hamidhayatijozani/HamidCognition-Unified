name: MCP Production E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run deployed MCP E2E
        env:
          MCP_E2E_URL: ${{ secrets.MCP_E2E_URL }}
          MCP_E2E_BEARER_TOKEN: ${{ secrets.MCP_E2E_BEARER_TOKEN }}
        run: python3 scripts/mcp_e2e_smoke.py
