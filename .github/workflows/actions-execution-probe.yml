name: Actions Execution Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner reached
        shell: bash
        run: |
          set -euo pipefail
          echo "ACTIONS_EXECUTION_PROBE=REACHED"
          echo "repository=$GITHUB_REPOSITORY"
          echo "sha=$GITHUB_SHA"
          echo "ref=$GITHUB_REF"
          echo "run_id=$GITHUB_RUN_ID"
          echo "event=$GITHUB_EVENT_NAME"
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "verified_sha=$(git rev-parse HEAD)"
