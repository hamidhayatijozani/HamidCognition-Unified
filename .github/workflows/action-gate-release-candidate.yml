name: Action Gate Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "action-gate-v*"

permissions:
  contents: read
  actions: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read canonical version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < action_gate/VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Action Gate version: $VERSION"

      - name: Validate expected release baseline
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < action_gate/VERSION)"
          test -n "$VERSION"

      - name: Require same-SHA release prerequisites
        id: prerequisites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          required_workflows=(
            "Action Gate Clean-Room Verification"
            "Action Gate Product Integrity"
            "Action Gate Production E2E Smoke"
          )
          required_codeql_checks=(
            "Analyze (python)"
            "Analyze (actions)"
          )

          for attempt in $(seq 1 180); do
            runs="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
            checks="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"

            missing=0
            for workflow in "${required_workflows[@]}"; do
              count="$(printf '%s' "$runs" | jq -r --arg name "$workflow" --arg sha "$GITHUB_SHA" \
                '[.workflow_runs[] | select(.name==$name and .conclusion=="success" and .head_sha==$sha)] | length')"
              if [ "$count" -lt 1 ]; then
                missing=1
                echo "Waiting for successful same-SHA prerequisite: $workflow"
              fi
            done

            for check in "${required_codeql_checks[@]}"; do
              count="$(printf '%s' "$checks" | jq -r --arg name "$check"                 '[.check_runs[] | select(.name==$name and .status=="completed" and .conclusion=="success")] | length')"
              if [ "$count" -lt 1 ]; then
                missing=1
                echo "Waiting for successful CodeQL check on $GITHUB_SHA: $check"
              fi
            done

            if [ "$missing" -eq 0 ]; then
              echo "All release prerequisites verified for $GITHUB_SHA"

              for workflow in "${required_workflows[@]}"; do
                run_id="$(printf '%s' "$runs" | jq -r --arg name "$workflow" --arg sha "$GITHUB_SHA" \
                  '[.workflow_runs[] | select(.name==$name and .conclusion=="success" and .head_sha==$sha)] | sort_by(.run_started_at) | last | .id')"
                run_sha="$(printf '%s' "$runs" | jq -r --arg name "$workflow" --arg sha "$GITHUB_SHA" \
                  '[.workflow_runs[] | select(.name==$name and .conclusion=="success" and .head_sha==$sha)] | sort_by(.run_started_at) | last | .head_sha')"
                case "$workflow" in
                  "Action Gate Clean-Room Verification") key="clean_room" ;;
                  "Action Gate Product Integrity") key="product_integrity" ;;
                  "Action Gate Production E2E Smoke") key="production_e2e" ;;
                esac
                echo "${key}_run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "${key}_run_sha=$run_sha" >> "$GITHUB_OUTPUT"
              done
              for check in "${required_codeql_checks[@]}"; do
                check_key="$(printf '%s' "$check" | tr '[:upper:] ' '[:lower:]_')"
                check_ok="$(printf '%s' "$checks" | jq -r --arg name "$check"                   '[.check_runs[] | select(.name==$name and .status=="completed" and .conclusion=="success")] | length')"
                echo "${check_key}_ok=$check_ok" >> "$GITHUB_OUTPUT"
              done
              exit 0
            fi

            sleep 10
          done

          echo "Release blocked: same-SHA prerequisite evidence was not observed."
          exit 1

      - name: Build production image
        run: docker build --pull -f action_gate/Dockerfile -t action-gate:${{ steps.version.outputs.version }} action_gate

      - name: Export image archive
        run: docker save action-gate:${{ steps.version.outputs.version }} -o action-gate-${{ steps.version.outputs.version }}.tar

      - name: Generate SHA256
        shell: bash
        run: sha256sum action-gate-${{ steps.version.outputs.version }}.tar | tee action-gate-${{ steps.version.outputs.version }}.tar.sha256

      - name: Create release manifest
        shell: bash
        run: |
          cat > action-gate-${{ steps.version.outputs.version }}.manifest.txt <<EOF
          product=HamidCognition Action Gate
          version=${{ steps.version.outputs.version }}
          commit=${{ github.sha }}
          image=action-gate:${{ steps.version.outputs.version }}
          archive=action-gate-${{ steps.version.outputs.version }}.tar
          clean_room_run_id=${{ steps.prerequisites.outputs.clean_room_run_id }}
          product_integrity_run_id=${{ steps.prerequisites.outputs.product_integrity_run_id }}
          production_e2e_run_id=${{ steps.prerequisites.outputs.production_e2e_run_id }}
          codeql_python_check=Analyze (python)
          codeql_actions_check=Analyze (actions)
          generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: action-gate-release-candidate-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            action-gate-${{ steps.version.outputs.version }}.tar
            action-gate-${{ steps.version.outputs.version }}.tar.sha256
            action-gate-${{ steps.version.outputs.version }}.manifest.txt
          if-no-files-found: error
          retention-days: 30
