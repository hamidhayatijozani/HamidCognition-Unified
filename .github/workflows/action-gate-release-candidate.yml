name: Action Gate Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "action-gate-v*"

permissions:
  contents: read
  actions: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read canonical version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < action_gate/VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Action Gate version: $VERSION"

      - name: Validate expected release baseline
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < action_gate/VERSION)"
          test -n "$VERSION"

      - name: Require successful Clean-Room, Product Integrity, and Production E2E for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs="$(curl -fsSL               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
            clean_ok="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name=="Action Gate Clean-Room Verification" and .conclusion=="success")] | length')"
            integrity_ok="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name=="Action Gate Product Integrity" and .conclusion=="success")] | length')"
            production_e2e_ok="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name=="Action Gate Production E2E Smoke" and .conclusion=="success")] | length')"
            if [ "$clean_ok" -ge 1 ] && [ "$integrity_ok" -ge 1 ] && [ "$production_e2e_ok" -ge 1 ]; then
              echo "Release prerequisites verified for $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Release blocked: successful Clean-Room, Product Integrity, and Production E2E runs for $GITHUB_SHA were not observed."
          exit 1


      - name: Build production image
        run: docker build --pull -f action_gate/Dockerfile -t action-gate:${{ steps.version.outputs.version }} action_gate

      - name: Export image archive
        run: docker save action-gate:${{ steps.version.outputs.version }} -o action-gate-${{ steps.version.outputs.version }}.tar

      - name: Generate SHA256
        shell: bash
        run: sha256sum action-gate-${{ steps.version.outputs.version }}.tar | tee action-gate-${{ steps.version.outputs.version }}.tar.sha256

      - name: Create release manifest
        shell: bash
        run: |
          cat > action-gate-${{ steps.version.outputs.version }}.manifest.txt <<EOF
          product=HamidCognition Action Gate
          version=${{ steps.version.outputs.version }}
          commit=${{ github.sha }}
          image=action-gate:${{ steps.version.outputs.version }}
          archive=action-gate-${{ steps.version.outputs.version }}.tar
          generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: action-gate-release-candidate-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            action-gate-${{ steps.version.outputs.version }}.tar
            action-gate-${{ steps.version.outputs.version }}.tar.sha256
            action-gate-${{ steps.version.outputs.version }}.manifest.txt
          if-no-files-found: error
          retention-days: 30
