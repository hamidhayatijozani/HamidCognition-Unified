services:
  - type: web
    name: hamidcognition-claimlab
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r research/claimlab/requirements.txt
    startCommand: uvicorn research.claimlab.http_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hamidcognition-claimlab-db
          property: connectionString

databases:
  - name: hamidcognition-claimlab-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: claimlab
    user: claimlab
